<title>RADIANT BURNT — Generative Poster Maker</title>

<!-- ══════════════════════════════════════════════════════════════════════════
     RADIANT BURNT / ANALOG SCANNER ARTIFACTS   (v3.0 — fluid feedback pipeline)
     Interactive generative poster maker. Zero dependencies, pure WebGL 1.

     PIPELINE
       [ TEX ]   Hero mask     -> 2D canvas -> texture (tMask)
                 Text (auto-fit), an uploaded image, or an uploaded SVG,
                 rasterised to a white/alpha coverage mask, optionally
                 edge-blurred before it enters the simulation.
       [PASS A]  Fluid sim     -> ping-pong FBO pair (persists across frames!)
                 Every frame: advect the PREVIOUS frame's accumulated state
                 along a flow field (a moving "brush" + curl-ish turbulence),
                 decay it (Persistence), then re-inject the fresh mask on
                 top. Because this is a feedback loop rather than a
                 recomputed-from-scratch shape, detail and motion keep
                 building up over time — this is what makes it read as an
                 actual fluid rather than a static drip.
       [PASS B]  Blur / Glow   -> FBO (tGlow)
                 Two iterations of a separable 9-tap Gaussian (H then V)
                 turn the sharp fluid state into a soft aura.
       [PASS C]  Thermal Map   -> FBO (rtScene)
                 core (sharp) + glow (blurred) drive a luminance lookup
                 that blends a user 2-colour "cool" ramp with a built-in
                 "hot" fire ramp (Exposure/Burn controls the blend), with
                 its own small chromatic split, screen-blended over ground.
       [ TEX ]   Poster type   -> 2D canvas -> texture (tText)
                 Metadata typography — everything except the hero word.
                 Flyer layout: kicker/date at the head, a label above a
                 stacked block of heavy lines, serial at the foot.
       [PASS 2]  Post process  -> default framebuffer (screen / export)
                 Reads rtScene + tText. First the optics: lens distortion,
                 melt and a jittered bokeh gather all warp the coordinate
                 the frame is READ at, with chromatic fringing folded into
                 the same taps. Then the metadata type composites, and only
                 then the emulsion: photocopy threshold, contrast, grain.

                 That order is deliberate. Everything before the composite
                 is glass and lens, so it bends the image; everything after
                 sits ON the print, so it runs on the true pixel grid.
                 Melting the grain along with the image is the tell that
                 gives a fake away.

     EXPORT: the fluid buffer is resolution-local, so a fresh export at a
     new resolution starts from an empty simulation. exportPNG() fast-
     forwards PASS A alone (no visual output) for enough steps that
     Persistence has converged, so the export looks like the "settled"
     on-screen state rather than a blank first frame.
     ══════════════════════════════════════════════════════════════════════ -->

<style>
:root{
  --bg:#0a0a0b; --panel:#101012; --panel2:#161619; --line:#26262b;
  --ink:#e8e8ea; --dim:#75757e; --hot:#ff3b18; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); overflow:hidden;
  font:400 13px/1.45 var(--mono); -webkit-font-smoothing:antialiased;
  display:grid; grid-template-columns:356px 1fr;
}

/* ─── STAGE ────────────────────────────────────────────────────────────── */
#stage{
  position:relative; display:grid; place-items:center; padding:28px; min-width:0; min-height:0;
  background:
    radial-gradient(120% 90% at 50% 0%, #131316 0%, #0a0a0b 60%),
    repeating-linear-gradient(45deg,#0c0c0e 0 2px,transparent 2px 8px);
}
#gl{
  display:block; max-width:100%; max-height:100%;
  box-shadow:0 40px 90px -20px #000, 0 0 0 1px #000, 0 0 60px -30px var(--hot);
  background:#000;
}
#gl.manual{cursor:crosshair}
#hud{
  position:absolute; left:14px; bottom:10px; color:var(--dim); font-size:10px;
  letter-spacing:.14em; text-transform:uppercase; pointer-events:none; user-select:none;
}
#hud b{color:var(--hot);font-weight:400}

/* ─── PANEL ────────────────────────────────────────────────────────────── */
#panel{
  background:var(--panel); border-right:1px solid var(--line);
  overflow-y:auto; overflow-x:hidden; scrollbar-width:thin;
  scrollbar-color:var(--line) transparent;
}
#panel::-webkit-scrollbar{width:8px}
#panel::-webkit-scrollbar-thumb{background:var(--line)}
.brand{
  padding:14px 16px 13px; border-bottom:1px solid var(--line); position:sticky; top:0;
  background:var(--panel); z-index:5; display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.brand h1{font-size:15px;letter-spacing:.2em;font-weight:600}
.brand h1 span{color:var(--hot)}
.brand p{color:var(--dim);font-size:11px;letter-spacing:.1em;margin-top:5px}
#resetBtn{width:auto;padding:7px 11px;font-size:10.5px;flex:none}

section{border-bottom:1px solid var(--line)}
section>h2{
  font-size:11.5px; letter-spacing:.16em; color:var(--dim); font-weight:600;
  padding:11px 16px; cursor:pointer; display:flex; justify-content:space-between;
  align-items:center; user-select:none; text-transform:uppercase;
}
section>h2:hover{color:var(--ink)}
section>h2::after{content:"−";color:var(--dim);font-size:13px}
section.closed>h2::after{content:"+"}
section.closed .body{display:none}
.body{padding:2px 16px 15px}
.body.dim>*:not(:first-child){opacity:.32;pointer-events:none;filter:saturate(0)}

.row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.row label{flex:1;color:var(--dim);font-size:11.5px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{width:54px;text-align:right;font-size:11.5px;color:var(--ink);font-variant-numeric:tabular-nums}

/* sliders */
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--line);
  outline:none;cursor:ew-resize;margin:9px 0 3px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;background:var(--ink);
  border-radius:50%;cursor:ew-resize;transition:background .12s;
}
input[type=range]:hover::-webkit-slider-thumb{background:var(--hot)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;background:var(--ink);border:0;border-radius:50%;cursor:ew-resize}
.slot{margin-bottom:11px}
.slot .row{margin-bottom:0}

/* colors */
input[type=color]{
  -webkit-appearance:none;appearance:none;width:34px;height:20px;padding:0;
  border:1px solid var(--line);background:none;cursor:pointer;
}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none}
input[type=color]::-moz-color-swatch{border:none}

/* text + selects */
input[type=text],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  font:400 12.5px var(--mono);padding:9px 10px;outline:none;
}
textarea{resize:vertical;min-height:60px}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--hot)}
.fld{margin-bottom:11px}
.fld span{display:block;color:var(--dim);font-size:10.5px;letter-spacing:.13em;margin-bottom:5px;text-transform:uppercase}

/* buttons */

  background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  font:500 11px var(--mono);letter-spacing:.1em;padding:10px 9px;cursor:pointer;
  text-transform:uppercase;transition:.12s;width:100%;
}
button:hover{background:var(--hot);border-color:var(--hot);color:#000}
button:active{transform:translateY(1px)}
button.hot{background:var(--hot);border-color:var(--hot);color:#000;font-weight:700}
button.hot:hover{filter:brightness(1.18)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.btns.one{grid-template-columns:1fr}

/* segmented (2-way) toggle buttons, e.g. Pause/Play, Manual/Auto */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:11px}
.seg button{padding:8px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#000;font-weight:700}
.seg button.act{border-color:var(--hot);color:var(--hot)}
.seg button.act:hover{background:var(--hot);color:#000}

/* file upload */
.filebtn{position:relative;overflow:hidden;margin-bottom:9px}
.filebtn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.filebtn .name{display:block;margin-top:5px;color:var(--dim);font-size:10.5px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* palette swatches */
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:11px}
.sw{height:30px;border:1px solid var(--line);cursor:pointer;position:relative;overflow:hidden}
.sw:hover{border-color:var(--ink)}
.sw i{position:absolute;top:0;bottom:0;width:33.34%}
.sw i:nth-child(1){left:0}.sw i:nth-child(2){left:33.33%}.sw i:nth-child(3){left:66.66%}

.toggle{display:flex;align-items:center;gap:8px;margin-bottom:9px;cursor:pointer;user-select:none}
.toggle input{appearance:none;-webkit-appearance:none;width:26px;height:14px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:.15s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--dim);transition:.15s}
.toggle input:checked{background:var(--hot)}
.toggle input:checked::after{left:14px;background:#000}
.toggle span{color:var(--dim);font-size:11.5px;letter-spacing:.04em}
.toggle.big{margin-bottom:12px}
.toggle.big span{color:var(--ink);font-size:12px;font-weight:600;letter-spacing:.08em}

/* responsive: panel becomes a bottom drawer */
@media (max-width:880px){
  body{grid-template-columns:1fr;grid-template-rows:1fr 46vh}
  #panel{border-right:0;border-top:1px solid var(--line)}
  #stage{padding:14px}
}

  text-align:center;padding:40px;letter-spacing:.1em;z-index:99}

  <form id="ui" autocomplete="off" onsubmit="return false"></form>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   1. PARAMETER STATE
   Every control writes here; every uniform reads from here each frame.
   ═══════════════════════════════════════════════════════════════════════ */
const P = {
  // ── Radiant Burnt master ──
  burnOn:true,

  // ── Content Source ──
  contentType:'text',       // 'text' | 'image' | 'svg'
  title:"don't\nbe\na b*tch",
  fontSize:1.00,          // 1.0 = fitted to the margins; above that it bleeds past them
  tracking:-0.02,           // letter-spacing, as a multiple of the fitted size
  leading:0.86,             // line height, as a multiple of the fitted size
  wordSpacing:0.0,          // extra gap at spaces, as a multiple of the fitted size
  assetScale:1.0,
  edgeBlur:6,               // heavy pre-blur is the main cause of glyphs merging
  meltSource:true,          // let the source shape itself drip away
  separateGlyphs:true,      // keep adjacent letterforms from fusing into a blob
  waterDrip:true,
  dripAmount:0.55,
  contentColor:'#ff4000',   // the core: what the content resolves to once it saturates
  customFontHero:null,      // font-family name once a custom font is loaded, else null

  // ── Fluid & Interaction ──
  playing:true,
  interactionMode:'auto',   // 'manual' | 'auto'
  animPreset:'drift',       // sweep | drift | orbit | pulse | boil
  autoSpeed:15,
  autoDirection:'ttb',      // ttb | btt | ltr | rtl
  autoLoopMode:'wrap',      // wrap | pingpong
  autoEasing:'easein',      // linear | easein | easeout | easeinout
  brushRadius:0.13,
  smearIntensity:0.235,
  persistence:0.93,
  fluidWarp:0.188,
  warpScale:4.7,

  // ── Optical Effects ──
  glowPrimary:'#57beff', glowSecondary:'#0f2da3', ground:'#050208',
  burnColor:'#f3cd12',      // fire handoff between the cool ramp and the core
  rgbSplitGlow:0.006,
  glowSoftness:16,
  exposure:1.0,


  // ── Post Process ──
  postOn:true,
  grain:0.0, grainSize:2.0, thresh:0.0, contrast:1.57,
  lensBlur:0.021, lensFocus:0.40, lensRange:0.62, lensHighlight:5.2,
  lensMode:'partial',       // partial = focus plane + edge falloff | full = whole frame
  lensQuality:'auto',       // auto = drop to 16 taps only if frames are actually being missed | high = always 48 | low = always 16
  lensDistort:-0.29, lensEdge:0.48, lensFringe:0.0,
  /* MELT AMOUNT IS BOUNDED BY STROKE WIDTH, and that is the whole story of
     why this looked like chrome. The read offset has to stay within a
     fraction of the artwork's line weight: at 0.20 the offset measured
     115px against a median stroke of 12px — nearly TEN stroke widths — so
     every interior pixel sampled something ten strokes away, the middle of
     each letter came back as background, and all that survived was a rim
     where the shift happened to still land on ink. It read as an outline
     because it WAS an outline: the interior had been sampled away.

     Around one stroke width the shape deforms and stays whole, which is
     what melting looks like. The range tops out at ten times the default
     rather than the twenty-five it allowed before. */
  melt:0.012, meltType:1.0, meltSpeed:1.7,
  /* Held just above the melt point (0.30). Far above it every column is
     permanently past yield and the field settles into steady flow; close
     to it, columns cross back and forth and the melt keeps re-forming. */
  meltHeat:1.54,            // heat input rate
  /* Hot patches need to be SMALLER than the letterforms. At 2.2 the noise
     ran about two cycles across the whole poster, so heat was effectively
     uniform inside any single glyph and the glyph just translated as a
     rigid body — no visible deformation, which is why the melt looked
     static however fast it was running. */
  meltScale:6.5,            // size of the hot / cold patches
  meltPoint:0.78,           // heat at which the material yields
  meltGravity:0.73,
  meltVisc:4.10,            // viscous drag
  meltTension:0.062,        // curvature smoothing along the sheet
  meltFlow:2.45,            // mass transport rate
  meltSpread:35.5,          // diffusion of the displacement past the shape

  // ── Poster metadata typography ──
  metaOn:false,
  subtitle:'FRANCESCO CASA\nMIKE B\nVALLINOTE DJ TEAM',
  kicker:'BRIK / STUDIO EDITION', date:'16.08.2026', serial:'NO. 0417 / 500',
  metaLabel:'LINE UP',
  metaScale:1.0,            // multiplies every metadata size (all sizes are fractions of W)
  metaTrack:0.20,           // tracking, in em of the size being drawn
  metaLead:1.02,            // line-height multiplier for the stacked block
  metaLabelGap:1.0,         // clearance between the label and the block, in label heights
  metaWeight:600,           // 300..900
  metaCase:'upper',         // asis | upper | snake
  metaMono:false,
  ink:'#f4f2ee', textMode:0, customFontMeta:null,

  // ── System ──
  /* Seed is pinned rather than randomised at load so the poster comes up as
     the tuned composition every time. Randomize Seed still works at runtime
     — this only fixes the starting point. */
  aspect:'2:3', seed:445.37439142258927, exportH:2400,
  gifWidth:420, gifFps:12, gifSeconds:3.0
};
const DEFAULTS = JSON.parse(JSON.stringify(P));

/* ══════════════════════════════════════════════════════════════════════════
   2. SHADERS
   ═══════════════════════════════════════════════════════════════════════ */

const VERT = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){
  vUv = aPos * 0.5 + 0.5;          // vUv.y = 0 at BOTTOM of frame, 1 at TOP
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

/* ─── Content sweep (injected into the fluid + thermal passes only) ────────
   Spatial reveal/erase wipe rather than a flat global fade. Both edges
   travel top -> bottom: the reveal edge descends to bring the content in,
   then the erase edge follows it down to take it away. The +-soft padding
   pushes the lines just past the frame at p=0 and p=1 so the extremes are
   genuinely "nothing shown" and "everything shown" rather than stopping a
   half soft-edge short. vUv.y is 0 at the BOTTOM of the frame.        */
const SWEEP = `
uniform float uSweepReveal, uSweepHide, uSweepSoft;
uniform vec2  uSweepAxis;
uniform float uSweepBias;

float sweepLine(float p, float soft){ return 1.0 + soft - p * (1.0 + 2.0 * soft); }

/* Project uv onto the sweep axis so the wipe follows Auto Direction, then
   apply the reveal edge and the trailing erase edge. */
float contentSweep(vec2 uv, float reveal, float hide, float soft){
  float c = uSweepBias + dot(uv, uSweepAxis);
  soft = max(soft, 0.0005);
  float lr = sweepLine(reveal, soft);
  float lh = sweepLine(hide,   soft);
  float r = smoothstep(lr - soft, lr + soft, c);          // shown ahead of the reveal edge
  float h = 1.0 - smoothstep(lh - soft, lh + soft, c);    // erased behind the erase edge
  return clamp(r * h, 0.0, 1.0);
}
`;

/* ─── Shared noise toolkit (injected into every fragment shader) ─────────── */
const NOISE = `
float hash11(float p){
  p = fract(p * 0.1031);
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}
float hash21(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*f*(f*(f*6.0-15.0)+10.0);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
const mat2 ROT = mat2(1.62, 1.20, -1.20, 1.62);
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++){
    v += a * vnoise(p);
    p = ROT * p;
    a *= 0.5;
  }
  return v;
}
float luma(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
`;

/* ═══════ PASS A — FLUID SIMULATION (persistent feedback) ══════════════════
   Reads its own previous output. Every step: advect along a flow field
   built from a moving "brush" (manual pointer or an automatic sweep) plus
   curl-ish turbulence, decay the result (Persistence), then re-inject the
   fresh content mask so the true shape never fully washes away. Because
   this accumulates frame over frame rather than recomputing from scratch,
   the result keeps developing organic detail — that's the whole trick.
   ═══════════════════════════════════════════════════════════════════════ */
const FRAG_FLUID = `
precision highp float;
varying vec2 vUv;

uniform sampler2D tPrev;    // this pass's own previous output (ping-pong)
uniform sampler2D tMask;    // fresh content mask (text / image / svg)
uniform float uAspect;
uniform vec2  uBrush;       // poster-space (x*aspect, y)
uniform float uBrushRadius;
uniform float uSmear;
uniform float uPersistence;
uniform float uWarp;
uniform float uWarpScale;
uniform vec2  uDragDir;
uniform float uDither;      // 1.0 only on the 8-bit fallback path
uniform float uMeltSource;  // 1.0 = the source shape itself is allowed to flow away
uniform float uDrip;        // water-drip gravity strength
uniform float uTime;
uniform float uSeed;
/* Frame delta expressed in 60Hz frames: dt * 60. Exactly 1.0 at 60fps, so
   the tuned look is unchanged there, ~0.42 at 144Hz, ~2.0 at 30fps. Every
   quantity below that used to be "per rendered frame" is scaled by this,
   which is what stops the trail from being shorter on a fast display. */
uniform float uStep;

${NOISE}
${SWEEP}

void main(){
  vec2 uv = vUv;
  vec2 P  = vec2(uv.x * uAspect, uv.y);

  /* Curl-ish turbulence: two decorrelated noise fields treated as a vector.
     Not a true divergence-free curl, but visually reads the same at this
     scale and is a fraction of the cost. */
  float tA = fbm(P * uWarpScale + uSeed + uTime * 0.06);
  float tB = fbm(P * uWarpScale + vec2(6.7, 2.3) + uSeed - uTime * 0.05);
  vec2 turb = (vec2(tA, tB) - 0.5) * uWarp;

  /* The brush drags harder nearby and fades smoothly with distance. */
  float dist = length(P - uBrush);
  float influence = exp(-pow(dist / max(uBrushRadius, 0.001), 2.0));

  /* THE ECHO FIX, PART 1 — step size.
     Advection must move the field by a SMALL fraction of the frame per
     step or the simulation stops being continuous. Unscaled, a Smear of
     0.14 displaced ~25% of the poster every single frame, so each frame's
     re-injected shape landed a quarter-screen below the last one and the
     trail read as a ladder of discrete copies. FLOW_STEP brings a step
     down to ~1% of the frame, so material flows instead of teleporting. */
  const float FLOW_STEP = 0.03;

  /* WATER DRIP.
     A pure brush smear moves every pixel the same way, which reads as a
     wipe rather than a liquid. Real running liquid does two things: it
     falls under gravity regardless of which way the brush travelled, and
     it runs faster where there is more of it. So add a downward term
     weighted by the material actually sitting here (mass), broken into
     per-column rivulets by a hash on x — that is what makes some columns
     race ahead into fingers while their neighbours lag, instead of the
     whole edge sliding down as one sheet. */
  float mass    = texture2D(tPrev, uv).a;
  float rivulet = 0.35 + 1.30 * hash11(floor(P.x * 90.0) + uSeed * 3.7);

  /* Gate the fall on the erase phase. Running the drip at full strength
     the whole time means the shape is bleeding downward even while it is
     still being fed, so it never holds still long enough to be read — it
     just sits there permanently molten. Holding it to a faint baseline
     until the sweep starts erasing gives the sequence people expect:
     forms up, holds legible, then runs once the feed stops. */
  float dripGate = mix(0.08, 1.0, uSweepHide);
  vec2  drip = vec2(0.0, -1.0) * uDrip * rivulet * (0.25 + 0.95 * mass) * dripGate;

  vec2 flow = ((uDragDir + turb) * uSmear * (0.22 + influence * 1.6) + drip) * FLOW_STEP * uStep;
  vec2 srcUV = clamp(uv - vec2(flow.x / uAspect, flow.y), 0.0, 1.0);

  float advected = texture2D(tPrev, srcUV).a;
  float fresh    = texture2D(tMask, uv).a;

  /* THE ECHO FIX, PART 2 — additive inflow instead of max().
     max(advected, inject) let a fresh stamp win outright at full strength,
     so the source shape re-printed itself every frame and could never be
     carried away — it stacked. Accumulating instead lets the brush feed
     material that advection then drags off as one continuous ribbon.
     Scaling inflow by (1 - persistence) keeps steady-state brightness
     stable when Persistence is changed, so the two controls stay
     independent. The crisp core is composited separately downstream from
     the raw mask, so this buffer is purely the flowing trail.        */
  const float INFLOW = 3.0;
  float ca = contentSweep(vUv, uSweepReveal, uSweepHide, uSweepSoft);
  /* With Melt Source Text on, the shape is fed at full strength wherever
     the sweep says it is present, rather than only under the brush — the
     glyphs read solid while the feed lasts, and once the sweep stops
     feeding them the drip and decay carry them off. Brush-weighted
     injection is kept for the other mode, where the crisp shape is
     composited separately downstream and this buffer is only the trail. */
  float inject = fresh * ca * mix(clamp(influence, 0.0, 1.0), 1.0, uMeltSource);
  /* Decay is exponential in TIME, not in frames rendered. Raising the
     per-frame factor to the power of the step turns "keep 96% each frame"
     into "keep 96% each 60th of a second", which is the same curve at
     60fps and the same curve everywhere else too. Feeding the inflow the
     matching (1 - p) keeps the equilibrium the comment above describes
     exactly where it was — the fixed point is independent of step size. */
  float p = pow(clamp(uPersistence, 0.0, 1.0), max(uStep, 1e-3));
  float result = min(advected * p + inject * (1.0 - p) * INFLOW, 1.0);

  /* 8-bit fallback only: a sub-LSB dither breaks up the staircase that
     repeated quantised decay would otherwise etch into the trail. Harmless
     no-op when the buffer is half-float. */
  result += (hash21(gl_FragCoord.xy + uSeed) - 0.5) * uDither * (1.0 / 255.0);

  gl_FragColor = vec4(vec3(result), result);
}`;

/* ═══════ PASS B — BLUR / GLOW ══════════════════════════════════════════════
   Separable 9-tap Gaussian. Run horizontally then vertically (and the pair
   twice from JS) to build a heavy, soft aura around the fluid state.
   ═══════════════════════════════════════════════════════════════════════ */
const FRAG_BLUR = `
precision highp float;
varying vec2 vUv;

uniform sampler2D tSrc;
uniform vec2  uTexel;
uniform vec2  uDir;
uniform float uRadius;

void main(){
  float w0 = 0.2270270270;
  float w1 = 0.1945945946;
  float w2 = 0.1216216216;
  float w3 = 0.0540540541;
  float w4 = 0.0162162162;

  vec2 o = uDir * uTexel * max(uRadius, 0.0001);

  vec4 sum = texture2D(tSrc, vUv) * w0;
  sum += texture2D(tSrc, vUv + o * 1.0) * w1;
  sum += texture2D(tSrc, vUv - o * 1.0) * w1;
  sum += texture2D(tSrc, vUv + o * 2.0) * w2;
  sum += texture2D(tSrc, vUv - o * 2.0) * w2;
  sum += texture2D(tSrc, vUv + o * 3.0) * w3;
  sum += texture2D(tSrc, vUv - o * 3.0) * w3;
  sum += texture2D(tSrc, vUv + o * 4.0) * w4;
  sum += texture2D(tSrc, vUv - o * 4.0) * w4;

  gl_FragColor = sum;
}`;

/* ═══════ PASS B1 — PYRAMID DOWNSAMPLE ═════════════════════════════════════
   Exact 2x box reduction: the four source texels that cover the destination
   texel, sampled at +-half a source texel. Cheap, alias-free, and the basis
   of the multi-scale glow.
   ═══════════════════════════════════════════════════════════════════════ */
const FRAG_DOWN = `
precision highp float;
varying vec2 vUv;
uniform sampler2D tSrc;
uniform vec2 uSrcTexel;
void main(){
  vec2 o = uSrcTexel * 0.5;
  vec4 s  = texture2D(tSrc, vUv + vec2( o.x,  o.y));
  s      += texture2D(tSrc, vUv + vec2(-o.x,  o.y));
  s      += texture2D(tSrc, vUv + vec2( o.x, -o.y));
  s      += texture2D(tSrc, vUv + vec2(-o.x, -o.y));
  gl_FragColor = s * 0.25;
}`;

/* ═══════ PASS B2 — PYRAMID COMBINE ════════════════════════════════════════
   Sum the blurred levels back into one glow field. Each level was blurred by
   the same radius in ITS OWN texels, so in screen space level i spans about
   2^(i+1) times as far — one pass yields a tight rim and a wide halo at once.
   ═══════════════════════════════════════════════════════════════════════ */
const FRAG_COMBINE = `
precision highp float;
varying vec2 vUv;
uniform sampler2D t0, t1, t2, t3;
uniform vec4  uW;
uniform float uGain;
void main(){
  float a = texture2D(t0, vUv).a * uW.x
          + texture2D(t1, vUv).a * uW.y
          + texture2D(t2, vUv).a * uW.z
          + texture2D(t3, vUv).a * uW.w;
  a *= uGain;
  gl_FragColor = vec4(vec3(a), a);
}`;

/* ═══════ PASS C — THERMAL GRADIENT MAP ═════════════════════════════════════
   core (sharp) + glow (blurred) drive a luminance lookup through one
   continuous ramp: black -> Secondary -> Primary -> Burn -> Content. The
   Exposure (Burn) control decides how much of the frame is pushed up into
   the hot end. Every stop is user-coloured, including the core — a fixed
   white core is what turns any large saturated area into a flat white
   mass, which is exactly what happens once Melt folds the content over
   itself. A small built-in chromatic split is applied to the glow itself
   (separate from the post pass's fringing).
   ═══════════════════════════════════════════════════════════════════════ */
const FRAG_THERMAL = `
precision highp float;
varying vec2 vUv;

uniform sampler2D tFluid;   // Pass A output — pure fluid trail (brush-weighted)
uniform sampler2D tGlow;    // Pass B output — blurred version of tFluid
uniform sampler2D tMask;    // raw content mask
uniform float uMeltSource;  // 1.0 = read the shape from the fluid so it can melt away
uniform float uSeparate;    // 1.0 = tighten falloff so adjacent glyphs stay distinct
uniform vec3  uGround;
uniform vec3  uPrimary, uSecondary;
uniform vec3  uContent;     // the core — what the content resolves to when it saturates
uniform vec3  uBurn;        // fire handoff between the cool ramp and the core
uniform float uRgbSplit;
uniform float uExposure;    // Exposure (Burn)
uniform float uFlat;        // 1.0 = bypass the ramp, show plain flat ink content
${SWEEP}

vec3 blendScreen(vec3 b, vec3 s){ return 1.0 - (1.0 - b) * (1.0 - s); }

/* Single continuous 7-stop ramp (black -> secondary -> primary -> built-in
   fire handoff -> white-hot core) instead of two separate ramps blended
   together — blending two independently-curved ramps produced visible
   "seams" where the mix crossed over; one monotonic ramp reads as one
   smooth gradient, matching a real thermal-camera colour map. */
vec3 thermalRamp(float t){
  vec3 c0 = vec3(0.0);
  vec3 c1 = uSecondary;
  vec3 c2 = mix(uSecondary, uPrimary, 0.55);
  vec3 c3 = uPrimary;
  vec3 c4 = uBurn;
  /* The stop between the burn and the core is interpolated per channel, not
     evenly. Those weights are the shape of incandescence: red saturates
     first, green follows, blue arrives last — which is why a fire ramp
     reads as heat rather than as a straight fade to the core colour. At the
     default swatches this reproduces the original hardcoded (1.0,0.6,0.1)
     stop exactly, so the ramp is unchanged until the user moves a colour. */
  vec3 c5 = mix(c4, uContent, vec3(1.0, 0.48, 0.055));
  vec3 c6 = uContent;
  vec3 col = mix(c0, c1, smoothstep(0.0/6.0, 1.0/6.0, t));
  col = mix(col, c2, smoothstep(1.0/6.0, 2.0/6.0, t));
  col = mix(col, c3, smoothstep(2.0/6.0, 3.0/6.0, t));
  col = mix(col, c4, smoothstep(3.0/6.0, 4.0/6.0, t));
  col = mix(col, c5, smoothstep(4.0/6.0, 5.0/6.0, t));
  col = mix(col, c6, smoothstep(5.0/6.0, 6.0/6.0, t));
  return col;
}
vec3 thermalAt(vec2 uv){
  /* The crisp core is the raw content shape (always fully present) merged
     with the fluid trail — the fluid buffer only ever holds brush-weighted
     material, so without this the core would fade wherever the brush
     currently isn't. */
  float rawCore   = texture2D(tMask, uv).a * contentSweep(uv, uSweepReveal, uSweepHide, uSweepSoft);
  float fluidCore = texture2D(tFluid, uv).a;

  /* Melt Source Text: when on, the visible shape is read ONLY from the
     fluid buffer, so it can drip and dissolve. The max() below is what
     used to pin the raw mask on top at full strength, which is why the
     source text stayed crisp and never melted no matter what the fluid
     did underneath it. */
  float core = mix(max(rawCore, fluidCore), fluidCore, uMeltSource);

  /* Keep Glyphs Separate: nearby letters merge into one blob because each
     one's wide glow fills the gap between them from both sides. Tightening
     the core's falloff and easing off the glow's additive fill lets the
     gaps stay dark so the letterforms read individually. */
  core = mix(core, smoothstep(0.10, 0.62, core), uSeparate);

  float glow = texture2D(tGlow, uv).a;
  float t = clamp(core + glow * mix(0.85, 0.30, uSeparate), 0.0, 1.0);
  /* Exposure (Burn) reshapes the intensity curve: low exposure keeps most
     of the frame in the cool (user-coloured) range; high exposure pushes
     more of it into the built-in hot core, so the control has a real,
     continuous effect rather than a simple brightness multiply. */
  float texp = pow(t, mix(1.55, 0.55, clamp(uExposure / 2.0, 0.0, 1.0)));
  return thermalRamp(texp);
}

void main(){
  if (uFlat > 0.5){
    float core = texture2D(tMask, vUv).a * contentSweep(vUv, uSweepReveal, uSweepHide, uSweepSoft);
    gl_FragColor = vec4(mix(uGround, uContent, core), 1.0);
    return;
  }

  vec2 cc  = vUv - 0.5;
  vec2 dir = normalize(cc + 1e-6);
  float split = uRgbSplit;

  vec3 cR = thermalAt(vUv + dir * split);
  vec3 cG = thermalAt(vUv);
  vec3 cB = thermalAt(vUv - dir * split);
  vec3 thermal = vec3(cR.r, cG.g, cB.b) * clamp(uExposure, 0.2, 2.0);

  vec3 col = blendScreen(uGround, thermal);
  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

/* ═══════ PASS M — MELT SIMULATION (persistent, time-integrated) ═══════════
   A noise field displaced along a gravity vector looks like melting for
   about a second, then gives itself away: every point sags by a fixed
   amount forever, nothing speeds up, nothing pools, and turning the amount
   down rewinds it. None of those are properties of melting.

   This is a real state buffer instead, ping-ponged like the fluid pass and
   integrated over time. Four quantities per texel:

     x  displacement  how far this column of material has run, in uv units
     y  velocity      how fast it is running right now
     z  mass          how much material is here — advected, and conserved
     w  heat          local temperature

   The physics that actually matter for how it reads:

     THRESHOLD   Material below its melt point is a solid and does not move
                 at all. This is why real melting produces distinct runs
                 breaking away from an intact sheet rather than the whole
                 surface sliding uniformly.
     MOMENTUM    Gravity accelerates melted material and viscous drag
                 opposes it, integrated frame over frame. A run that has
                 been going for a second moves faster than one that just
                 broke loose, so runs stretch as they descend — the single
                 thing a static displacement cannot fake.
     CONSERVATION Whatever leaves one cell arrives in the one below, so
                 material genuinely piles up where flow slows and thins
                 where it accelerates. That is what necks a drip and swells
                 its head, and it cannot emerge from a per-pixel function.
     TENSION     Curvature smoothing along the sheet. Without it every
                 column falls independently and the result is vertical
                 streaks; with it neighbours pull on each other and the
                 sheet hangs in rounded runs.

   Everything is kept inside 0..1 so the 8-bit fallback path behaves the
   same as the half-float one, just with coarser steps.
   ═══════════════════════════════════════════════════════════════════════ */
const FRAG_MELT = `
precision highp float;
varying vec2 vUv;

uniform sampler2D tPrev;     // own previous state (ping-pong)
uniform sampler2D tMask;     // static content coverage
uniform sampler2D tFlow;     // PASS A fluid state — the material as it actually moves
uniform vec2  uTexel;
uniform float uAspect;
uniform float uDt;
uniform float uSeed;
uniform float uTime;

uniform float uHeat;         // heat input rate
uniform float uHeatScale;    // size of the hot / cold patches
uniform float uMeltPoint;    // heat at which the material yields
uniform float uGravity;
uniform float uViscosity;
uniform float uTension;
uniform float uFlow;         // mass transport rate
uniform float uSpread;       // how far the displacement diffuses past the shape
uniform float uReset;

${NOISE}

void main(){
  vec2 uv  = vUv;

  /* Coverage comes from the LIVE fluid state as well as the static mask.
     Feeding the sim from the mask alone was the reason it settled: the
     material it thought it had never changed, so once heat, flow and
     displacement balanced there was nothing left to perturb it and the
     field froze at equilibrium. The artwork is moving the whole time —
     sweeping, drifting, decaying — so taking coverage from the fluid means
     material genuinely arrives and departs, and the melt keeps being fed
     new solid to work on for as long as the poster animates. */
  float cov = max(texture2D(tMask, uv).a, texture2D(tFlow, uv).a);

  if (uReset > 0.5){ gl_FragColor = vec4(0.0, 0.0, cov, 0.0); return; }

  vec4  s    = texture2D(tPrev, uv);
  float disp = s.x, vel = s.y, mass = s.z, heat = s.w;

  vec2 up = vec2(0.0, uTexel.y);        // vUv.y = 0 at the BOTTOM, so +y is up
  vec2 rt = vec2(uTexel.x, 0.0);
  vec4 sUp = texture2D(tPrev, uv + up);
  vec4 sDn = texture2D(tPrev, uv - up);
  vec4 sL  = texture2D(tPrev, uv - rt);
  vec4 sR  = texture2D(tPrev, uv + rt);

  /* ── HEAT ──────────────────────────────────────────────────────────────
     Applied unevenly, because real melting starts at hot spots and spreads
     — never uniformly across a surface. Lateral diffusion is what lets
     those patches grow into each other instead of staying isolated dots. */
  /* The hot patches drift. A fixed heat source melts the same places
     forever and the picture reaches one final shape; a real flame or lamp
     never holds that still, and letting it wander means regions cool and
     re-solidify while others start to go. */
  vec2 hp = vec2(uv.x * uAspect, uv.y) * uHeatScale
          + uSeed + vec2(uTime * 0.021, uTime * 0.037);
  float hotspot = fbm(hp);
  float diff = (sUp.w + sDn.w + sL.w + sR.w) * 0.25;
  /* Diffusion is deliberately weak. Conducting heat quickly evens the field
     out within a few seconds, every cell crosses the melt point together,
     and the whole sheet slides as one — a uniform shift, not a melt. Slow
     conduction keeps the hot patches distinct so some material runs while
     the material beside it is still solid. */
  heat = mix(heat, diff, clamp(uDt * 0.8, 0.0, 0.2));
  heat += uHeat * uDt * (0.15 + 1.85 * hotspot) * step(0.01, max(mass, cov));
  heat *= 1.0 - uDt * 0.10;

  float melted = smoothstep(uMeltPoint, uMeltPoint + 0.20, heat);

  /* LATENT HEAT. A phase change absorbs energy, so actively melting
     material cools itself and stalls until more heat arrives. This is what
     stops the sheet from melting everywhere at once and turns it into a
     front that advances, stalls and re-advances — the self-regulation is
     doing the work here, not a hand-authored animation curve. */
  heat -= melted * uDt * 0.55;
  heat  = clamp(heat, 0.0, 1.0);

  /* ── MOMENTUM ──────────────────────────────────────────────────────────
     Gated on how much material is actually left in this column. Without
     that gate every column keeps accelerating until it pins against the
     displacement clamp, the whole field saturates within a few seconds and
     the melt goes static — which is the same dead-end as a fixed noise
     warp, just reached more slowly. Draining a column to a stop instead
     means runs travel: the cell empties and halts while the cells below it
     receive that mass and start moving, so the motion keeps migrating for
     as long as there is heat. */
  float supply = smoothstep(0.0, 0.14, mass);
  vel += uGravity * melted * supply * uDt;
  vel *= 1.0 - clamp(uViscosity * uDt, 0.0, 0.95);
  vel  = clamp(vel * mix(0.35, 1.0, supply), 0.0, 1.0);

  /* ── MASS TRANSPORT (upwind) ───────────────────────────────────────────
     Flux out is mass * velocity; flux in is the same quantity taken from
     the cell above.

     The anchor toward coverage only applies WHERE THERE IS COVERAGE. It
     used to apply everywhere, which quietly forbade the whole point of the
     simulation: outside the letterforms coverage is zero, so any material
     transported down there was immediately pulled back to nothing. Runs
     could never leave the shape they came from, so instead of drips the
     sim could only shuffle material inside the glyphs. Beyond the shape,
     transported mass now persists and thins out slowly, which is what lets
     a run actually hang below the letter that fed it. */
  float hasCov  = smoothstep(0.0, 0.02, cov);
  float fluxIn  = sUp.z * max(sUp.y, 0.0);
  float fluxOut = mass  * max(vel,   0.0);
  mass += (fluxIn - fluxOut) * uFlow * uDt;
  mass  = mix(mass, cov, uDt * 0.25 * (1.0 - melted) * hasCov);
  mass *= 1.0 - uDt * 0.20 * (1.0 - hasCov);
  mass  = clamp(mass, 0.0, 1.0);

  /* ── DISPLACEMENT TRAVELS WITH THE MATERIAL ────────────────────────────
     Integrating velocity in place looks right for a few seconds and then
     dies: every flowing cell climbs to the clamp and freezes there, which
     is the same static end-state as a noise warp. Displacement is a
     property OF the material, so it advects — as a cell's material flows
     out it is replaced by material from above carrying the upstream
     displacement. Cells therefore drain back toward rest while the runs
     themselves migrate downward, and the field keeps evolving for as long
     as there is heat to melt more of it. */
  float replaced = clamp(fluxOut * uFlow * uDt * 6.0, 0.0, 1.0);
  disp = mix(disp, sUp.x, replaced);

  /* ── LEAKY INTEGRATION ─────────────────────────────────────────────────
     Displacement accumulates velocity but also relaxes, so it settles at
     roughly velocity/leak instead of climbing until it hits the ceiling.

     A pure integral was the bug behind Melt Amount going dead: within a
     few seconds 66% of the sheet was pinned at the clamp and 28% was still
     solid, leaving a field that was effectively binary. Melt Amount had
     almost nothing to scale, so its response flattened above ~0.03 and the
     slider stopped doing anything useful over most of its range.

     Leaking keeps the physics — displacement still lags a rising velocity,
     so acceleration reads — while spreading the field across the range:
     material running at half speed sits at half the displacement. Solid
     material leaks faster, because a column that has set has no run left
     in it. */
  disp += vel * uDt;
  disp *= 1.0 - clamp(uDt * (0.15 + 1.20 * (1.0 - melted)), 0.0, 0.5);
  disp  = clamp(disp, 0.0, 1.0);

  /* Latent heat cools a running column below its melt point again, so it
     sets and its run relaxes out (handled by the leak term above). That
     closes the loop: heat, yield, run, cool, set, reheat — every stage a
     consequence of the physics rather than a scripted animation. */

  /* ── SURFACE TENSION ───────────────────────────────────────────────── */
  disp += (sL.x + sR.x + sUp.x + sDn.x - 4.0 * disp) * uTension * uDt * 30.0;

  /* ── SPREADING: WHY THE FIELD MUST NOT BE LETTER-SHAPED ────────────────
     The displacement was masked by coverage, so its boundary coincided
     exactly with the artwork's own boundary. The post pass offsets the
     READ coordinate by this field, and an offset shaped like the letter
     means: inside the letter sample from above, outside sample from here.
     The letter's edge therefore gets sampled from two different places at
     once and comes back duplicated — a bright rim tracing every glyph,
     with the interior merely translated underneath it.

     That rim is inherent to a coverage-shaped field. Softening the mask
     could not remove it, and neither could smoothing the read, because
     both leave the boundary where it is; the amplitude just scaled with
     Melt Amount, which is why zeroing the melt was the only thing that
     ever made it go away.

     So the field spreads. Displacement diffuses outward past the shape
     that generated it and the mask is gone entirely — the offset varies
     gradually across the letter's edge instead of stepping at it, so the
     glyph deforms rather than being cut out and shifted. Beyond the
     artwork the offset displaces empty ground, which costs nothing
     visually because there is nothing there to tear. */
  float nb = (sL.x + sR.x + sUp.x + sDn.x) * 0.25;
  disp = mix(disp, nb, clamp(uDt * uSpread, 0.0, 0.5));

  gl_FragColor = vec4(clamp(disp, 0.0, 1.0), vel, mass, heat);
}`;

/* ═══════ PASS 2 — POST PROCESS ════════════════════════════════════════════ */
const FRAG_POST = `
precision highp float;
varying vec2 vUv;

uniform sampler2D tScene;   // finished Radiant Burnt artwork (ground + hero content)
uniform sampler2D tText;    // poster metadata typography (white + alpha)
uniform sampler2D tMelt;    // PASS M state: displacement / velocity / mass / heat
uniform float uAspect;
uniform float uUnit;        // poster-space reference height (resolution independent)
uniform float uTime;
uniform float uSeed;

uniform float uGrain;
uniform float uGrainSize;   // crystal size, in poster units
uniform float uThresh;      // photocopy bleed
uniform float uContrast;
uniform float uMode;        // metadata type blend mode 0..3
uniform vec3  uInk;

uniform float uLens;        // bokeh disc radius (poster fraction)
uniform float uLensFocus;   // uv.y of the sharp plane
uniform float uLensRange;   // width of the in-focus band
uniform float uLensHi;      // highlight weighting for the disc gather
uniform float uLensDistort; // radial distortion: + barrels, - pincushions
uniform float uLensEdge;    // field curvature — how much the corners defocus
uniform float uLensFull;    // 1 = defocus the whole frame evenly, 0 = selective
uniform float uLensLow;     // 1 = fewer gather taps, for slower hardware
uniform float uLensFringe;  // lateral chromatic aberration
uniform float uMelt;        // how far the simulated run displaces the read
uniform float uMeltType;    // how much of the metadata type inherits the melt

${NOISE}

const float GOLDEN = 2.39996323;   // golden angle — spreads spiral taps evenly

/* Interleaved gradient noise (Jimenez). Used instead of a plain hash to pick
   each pixel's spiral rotation: a white-noise angle decorrelates neighbours
   but leaves the leftover error spread evenly across all frequencies, which
   at a usable tap count shows up as coarse mush. IGN concentrates that error
   in the high frequencies, where it reads as fine tooth the grain absorbs —
   the same tap budget, markedly cleaner. */
float ign(vec2 p){
  return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
}

/* ── MELT ────────────────────────────────────────────────────────────────
   Domain warp with a deliberate downward bias. A low-frequency fbm is read
   as a height field and used to sample from ABOVE the current row, so the
   image sags into the row rather than wobbling around it — sampling
   symmetrically is what makes most "melt" shaders read as mere distortion.
   The drip exponent starves the mid-values so the sheet stays mostly intact
   and only the peaks stretch into long hanging runs, and gravity ramps the
   whole thing toward the bottom of the frame. vUv.y is 0 at the BOTTOM, so
   a POSITIVE y offset pulls content downward.                            */
vec2 meltUV(vec2 p, float amt){
  if (amt <= 0.0) return p;

  /* The displacement is read out of the simulation rather than generated
     here. Sampling from ABOVE is what makes it read as sagging: the
     material now at p is the material that used to be at p + d.

     Read through a small cross rather than a single tap. The field has a
     falloff at the boundary of the shape, and a single tap turns that into
     a step in the READ COORDINATE — which the image reproduces as a hard
     seam tracing the outline. Averaging a few taps costs four lookups and
     removes the seam at its source. */
  float d = (texture2D(tMelt, p).x * 2.0
           + texture2D(tMelt, p + vec2( 0.0035, 0.0)).x
           + texture2D(tMelt, p + vec2(-0.0035, 0.0)).x
           + texture2D(tMelt, p + vec2(0.0,  0.0035)).x
           + texture2D(tMelt, p + vec2(0.0, -0.0035)).x) / 6.0;

  /* Lateral slide follows the slope of the run — material spilling off a
     steep shoulder drifts sideways instead of dropping straight down.

     THE CHROME-RIM FIX. This was a raw finite difference multiplied by the
     full melt amount. The displacement field's steepest gradients sit
     exactly on the outline of the shape, so the sideways shift spiked at
     every boundary and tore a hard rim around every letter — the metallic
     edge, with the interior merely translated underneath it. Widening Melt
     Amount's range multiplied that rim by the same factor. It is a slope
     now: divided by the sampling distance, clamped so a boundary cannot
     produce an unbounded shift, and scaled far more conservatively. */
  float slope = (texture2D(tMelt, p + vec2(0.0035, 0.0)).x
               - texture2D(tMelt, p - vec2(0.0035, 0.0)).x) / 0.007;

   sqrt radius so they fill the disc at even density, and each tap is
   weighted by a high power of its own luminance. That weighting is the
   whole difference between defocus and blur: bright points keep their
   energy and open into flat discs instead of dissolving into grey mush.
   The per-channel offsets fold the chromatic aberration into the same
   taps, so the fringing survives the defocus rather than being averaged
   away by it.

   of offsets, so a hard edge — lettering above all — reproduces as a
   handful of aligned, individually sharp ghosts. That is the "layers of
   text at different blur amounts" look, and no amount of extra taps
   removes it, because the copies stay in register. Rotating the spiral
   by a per-pixel random angle decorrelates neighbouring pixels: the same

const int LENS_TAPS_${suffix} = ${taps};

vec3 lensGather${suffix}(vec2 uv, vec2 dir, float amt, float radius, float jitter){
  vec3  sum  = vec3(0.0);

     turned off those three reads land on the same texel and return the
     same value, so the whole gather ran at triple cost for no difference —

       centre. With the half-offset the smallest tap radius was ~10% of the
       disc, which punched a small hole through the middle of every bokeh

/* GLSL ES 1.00 requires a constant loop bound, so the two quality levels

              be sampled through an INTERPOLATED noise at a chosen scale.

              reads as TV static or a dirty sensor, never as film.

              coarse layer modulates the amplitude of the fine one. Without

vec3 filmGrain(vec2 Pp, float size, float jump){

     Sampling the type's alpha per channel at the fringe offsets gives the
     lettering RGB edges that match the artwork exactly.
     The type also takes its own (usually weaker) share of the melt so it
     drips with the plate while staying readable, and a fraction of the
     defocus so it sits in the same optical space as the artwork.       */
  vec2 tuv = meltUV(duv, uMelt * uMeltType);

  else if (uMode < 1.5) res = mix(col, col * ink, ta);                        // multiply

  /* Poster-space coordinates: all artefacts below are sized relative to the

  vec2 P = vec2(uv.x * uAspect, uv.y) * uUnit;

     drift. Grain that slides between frames reads as a moving texture laid

  float t24  = floor(uTime * 24.0);

}`;

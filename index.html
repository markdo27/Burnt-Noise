  f2(progMelt,'uTexel', 1 / simW, 1 / simH);
  f1(progMelt,'uAspect', simW / simH);
  f1(progMelt,'uTime', phase);
  /* Clamped so a dropped frame or a paused tab cannot hand the integrator a
     huge timestep and blow the velocity field up. */
  f1(progMelt,'uDt', Math.min(dt, 1 / 30));
  f1(progMelt,'uSeed', P.seed);
  f1(progMelt,'uHeat', P.meltHeat);
  f1(progMelt,'uHeatScale', P.meltScale);
  f1(progMelt,'uMeltPoint', P.meltPoint);
  f1(progMelt,'uGravity', P.meltGravity);
  f1(progMelt,'uViscosity', P.meltVisc);
  f1(progMelt,'uTension', P.meltTension);
  f1(progMelt,'uFlow', P.meltFlow);
  f1(progMelt,'uSpread', P.meltSpread);
  f1(progMelt,'uReset', 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  meltFront = 1 - meltFront;
}

const maskTex = makeTex();   // hero content mask, CPU-uploaded from heroCanvas
const textTex = makeTex();   // metadata typography, CPU-uploaded from textCanvas

/* ══════════════════════════════════════════════════════════════════════════
   4. TYPOGRAPHY / ASSET  →  CANVAS 2D  →  TEXTURE
   Two independent canvases: the hero content (feeds the fluid pipeline) and
   the Swiss metadata layout (kicker, date, subtitle, serial, edge text,
   crop marks). Both are drawn in white with alpha; colour is applied later.
   ═══════════════════════════════════════════════════════════════════════ */
const textCanvas = document.createElement('canvas');
const tctx = textCanvas.getContext('2d');
const heroCanvas = document.createElement('canvas');
const hctx = heroCanvas.getContext('2d');
const scratchCanvas = document.createElement('canvas');

const SANS  = '"Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif';
const HEAVY = '"Helvetica Neue", "Arial Black", Helvetica, Arial, sans-serif';
const MONO  = '"SF Mono", "Roboto Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace';

let uploadedAsset = null;   // HTMLImageElement for 'image' / 'svg' content types

/** Custom uploaded fonts (Content Source: hero font; Metadata Typography:
    optional separate override). Falls back to the system faces above. */
function heroFont(){ return P.customFontHero || HEAVY; }
function metaFont(){
  if (P.customFontMeta) return P.customFontMeta;
  if (P.metaMono) return MONO;
  return P.customFontHero || SANS;
}

function loadFontFile(file, targetKey){
  const reader = new FileReader();
  reader.onload = () => {
    const family = 'RBFont_' + targetKey + '_' + Date.now();
    const face = new FontFace(family, reader.result);
    face.load().then(loaded => {
      document.fonts.add(loaded);
      P[targetKey] = family;
      drawHeroMask(bufW, bufH);
      drawPoster(bufW, bufH);
      buildUI();
    }).catch(() => { /* unsupported/corrupt font file — silently keep the previous font */ });
  };
  reader.readAsArrayBuffer(file);
}

/** Draw text with manual letter-spacing (tracking) and optional extra word
    spacing applied at space characters. Supports left/right/center. */
function tracked(ctx, text, x, y, track, align, wordGap){
  wordGap = wordGap || 0;
  const chars = [...text];
  const adv = c => ctx.measureText(c).width + track + (c === ' ' ? wordGap : 0);
  let total = 0;
  for (const c of chars) total += adv(c);
  if (chars.length) total -= track;
  let cx = align === 'right' ? x - total : align === 'center' ? x - total/2 : x;
  for (const c of chars){ ctx.fillText(c, cx, y); cx += adv(c); }
  return total;
}

/** Advance width of a line including tracking and extra word spacing, so
    measurement matches exactly what tracked() will draw. */
function lineWidth(ctx, text, track, wordGap){
  track = track || 0; wordGap = wordGap || 0;
  const chars = [...text];
  let total = 0;
  for (const c of chars) total += ctx.measureText(c).width + track + (c === ' ' ? wordGap : 0);
  if (chars.length) total -= track;
  return total;
}

/** Greedy word wrap honouring explicit \n line breaks. Tracking and word gap
    are optional (metadata callers pass neither and get plain measurement). */
function wrap(ctx, text, maxW, track, wordGap){
  const out = [];
  for (const para of text.split('\n')){
    let line = '';
    for (const word of para.split(/\s+/)){
      if (!word) continue;
      const test = line ? line + ' ' + word : word;
      if (lineWidth(ctx, test, track, wordGap) > maxW && line){ out.push(line); line = word; }
      else line = test;
    }
    out.push(line);
  }
  return out;
}

/** Hero content mask: text (auto-fit), an uploaded image, or an uploaded SVG,
    rasterised to white-with-alpha coverage, then optionally edge-blurred.
    This is the ONLY thing that feeds the fluid pipeline (tMask). */
function drawHeroMask(W, H){
  heroCanvas.width = W; heroCanvas.height = H;
  const c = hctx;
  c.clearRect(0, 0, W, H);

  const M  = 0.085 * W;
  const cw = W - M * 2;

  if ((P.contentType === 'image' || P.contentType === 'svg') && uploadedAsset){
    /* SVGs are normalised on upload to always carry intrinsic dimensions,
       but keep a fallback so a pathological asset can never divide by zero. */
    const iw = uploadedAsset.naturalWidth  || uploadedAsset.width  || 1000;
    const ih = uploadedAsset.naturalHeight || uploadedAsset.height || 1000;
    {
      const fitW = W * 0.72 * P.assetScale;
      const fitH = fitW * (ih / iw);
      c.drawImage(uploadedAsset, (W - fitW) / 2, (H - fitH) / 2, fitW, fitH);
      const id = c.getImageData(0, 0, W, H);
      const d = id.data;

      /* Work out what "coverage" means for THIS asset.
         A logo — SVG or cut-out PNG — carries its shape in the ALPHA channel
         and is very often solid black. Scoring that by luminance gives 0
         across the whole logo, i.e. an empty mask, which is exactly why an
         uploaded SVG looked like the effect was broken. So: use alpha
         whenever the asset has any transparency, and only fall back to
         luminance for a fully opaque image (a photo). In that opaque case,
         flip polarity when the picture is predominantly light, so a dark
         subject on a white ground becomes the shape instead of the ground. */
      let hasAlpha = false, lumSum = 0;
      const px = d.length / 4;
      for (let i = 0; i < d.length; i += 4){
        if (d[i+3] < 250) hasAlpha = true;
        lumSum += d[i]*0.2126 + d[i+1]*0.7152 + d[i+2]*0.0722;
      }
      const invert = !hasAlpha && (lumSum / Math.max(px,1)) > 127.5;

      for (let i = 0; i < d.length; i += 4){
        let cov;
        if (hasAlpha) cov = d[i+3];
        else {
          const l = d[i]*0.2126 + d[i+1]*0.7152 + d[i+2]*0.0722;
          cov = invert ? 255 - l : l;
        }
        d[i] = 255; d[i+1] = 255; d[i+2] = 255; d[i+3] = cov;
      }
      c.putImageData(id, 0, 0);
    }
  } else {
    c.fillStyle = '#fff';
    c.textBaseline = 'alphabetic';

    const topLim = M + 0.075 * W;
    const botLim = H - M - 0.10 * W;
    /* The fit is to the frame itself. Font Size used to be folded in here,
       as a fraction of the height budget, which capped it at the fit: the
       loop only ever shrinks from its starting size, so once the type was
       no longer height-bound the value stopped changing anything. Every
       setting from 1.0 up rendered the same poster. It scales the fitted
       result now instead, so the whole range does something and the type
       can bleed past the margins. */
    const maxH   = Math.max(1, botLim - topLim);

    const text = P.title.trim() || 'BURNT';
    /* Tracking / leading / word spacing are all expressed as multiples of the
       fitted size, so they stay proportional at any export resolution. The
       auto-fit loop has to account for tracking too, otherwise wide tracking
       would overflow the measured width. */
    let px = 0.30 * W, lines = [], lead = 0;
    for (let guard = 0; guard < 60; guard++){
      c.font = `900 ${px}px ${heroFont()}`;
      const tr = px * P.tracking;
      const wg = px * P.wordSpacing;
      lines = wrap(c, text, cw, tr, wg);
      lead  = px * P.leading;
      const widest = Math.max(...lines.map(l => lineWidth(c, l, tr, wg)), 0);
      if (lines.length * lead <= maxH && widest <= cw) break;
      px *= 0.955;
      if (px < 0.02 * W) break;
    }
    /* Applied after the fit, so 1.0 is exactly "as large as the margins
       allow" and anything above it overflows them deliberately. The line
       breaks stay as they were fitted, which keeps the composition and
       changes only its size. lead has to be recomputed - the loop left it
       holding a value derived from the pre-scaled size. */
    px  *= P.fontSize;
    lead = px * P.leading;

    c.font = `900 ${px}px ${heroFont()}`;
    const track   = px * P.tracking;
    const wordGap = px * P.wordSpacing;
    const blockH  = lines.length * lead;
    const top0    = topLim + (botLim - topLim - blockH) / 2 + px * 0.78;
    lines.forEach((ln, i) => tracked(c, ln, W / 2, top0 + i * lead, track, 'center', wordGap));
  }

  /* Source Edge Blur: soften the mask before it enters the simulation. */
  if (P.edgeBlur > 0.1){
    scratchCanvas.width = W; scratchCanvas.height = H;
    const sx = scratchCanvas.getContext('2d');
    sx.filter = `blur(${P.edgeBlur}px)`;
    sx.drawImage(heroCanvas, 0, 0);
    c.clearRect(0, 0, W, H);
    c.drawImage(scratchCanvas, 0, 0);
  }

  gl.bindTexture(gl.TEXTURE_2D, maskTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, heroCanvas);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  resetFluid();   // content changed — restart the simulations clean
  resetMelt();
}

/* ── metadata typography: shared treatment ───────────────────────────────
   Every preset below draws different furniture but sets type through these
   four helpers, so the Scale / Tracking / Leading / Weight / Case controls
   behave identically whichever layout is active. All sizes are fractions
   of W, so a 4200px export is the same poster as the 1400px preview.   */

/** Case treatment. snake_case is the file-stamp idiom from the reference:
    lowercase with the spaces welded shut, which is what makes a tiny tag
    read as a machine stamp rather than as a caption. */
function metaText(s){
  const t = String(s == null ? '' : s);
  if (P.metaCase === 'upper') return t.toUpperCase();
  if (P.metaCase === 'snake') return t.toLowerCase().replace(/\s+/g, '_');
  return t;
}

function metaPx(W, frac){ return Math.max(1, Math.round(frac * W * P.metaScale)); }

function metaMetrics(W){
  const M = 0.085 * W;
  return { M, small: metaPx(W, 0.0145) };
}

/** The stacked block honours explicit line breaks when the user supplies
    them and falls back to wrapping, so one long subtitle still stacks. */
function blockLines(c, px, maxW, weight){
  const raw = P.subtitle.trim();
  if (!raw) return [];
  c.font = `${weight} ${px}px ${metaFont()}`;
  const explicit = raw.split('\n').map(s => s.trim()).filter(Boolean);
  if (explicit.length > 1) return explicit.slice(0, 6);
  return wrap(c, raw, maxW).slice(0, 6);
}

/** Rave flyer: a tiny label sitting above a stacked block of heavy lines
    with the leading pulled almost down to the cap height. Everything hangs
    off one left edge and there are no rules — the density of the block IS
    the structure, which is why adding a grid to this layout kills it.
    Tracking goes negative against the shared control for the same reason:
    display sizes need to close up, not open out.

    THE LABEL GAP. Offsetting the label by a fraction of the block's line
    height collides with it, because a line's ink rises above its baseline
    by roughly three quarters of its size — so a 0.62-line offset puts the
    label inside the first row's ascenders whenever the type is heavy or
    the leading is tight. Measuring the actual ascent of the first line and
    clearing THAT is the only offset that holds across weights, scales and
    custom fonts. actualBoundingBoxAscent is reported by every current
    engine; the 0.72em fallback covers the case where it comes back zero. */
function drawMetaFlyer(c, W, H){
  const { M, small } = metaMetrics(W);
  const heavy = Math.max(P.metaWeight, 700);

  c.font = `${P.metaWeight} ${small}px ${metaFont()}`;
  tracked(c, metaText(P.kicker), M,     M + small, small * P.metaTrack, 'left');
  tracked(c, metaText(P.date),   W - M, M + small, small * P.metaTrack, 'right');

  const linePx = metaPx(W, 0.042);
  const lead   = linePx * Math.min(P.metaLead, 1.06);
  const lines  = blockLines(c, linePx, W - M * 2, heavy);
  const base   = H - M - 0.055 * W;
  const top    = base - (lines.length - 1) * lead;

  const tight = linePx * Math.max(-0.06, P.metaTrack - 0.18);
  c.font = `${heavy} ${linePx}px ${metaFont()}`;

  if (lines.length && P.metaLabel.trim()){
    const m = c.measureText(lines[0]);
    const ascent = m.actualBoundingBoxAscent || linePx * 0.72;
    const labelPx = metaPx(W, 0.0125);
    c.font = `${P.metaWeight} ${labelPx}px ${metaFont()}`;
    c.globalAlpha = 0.8;
    tracked(c, metaText(P.metaLabel), M,
            top - ascent - labelPx * P.metaLabelGap,
            labelPx * (P.metaTrack + 0.18), 'left');
    c.globalAlpha = 1;
    c.font = `${heavy} ${linePx}px ${metaFont()}`;
  }

  lines.forEach((ln, i) => tracked(c, metaText(ln), M, top + i * lead, tight, 'left'));

  const sp = metaPx(W, 0.0115);
  c.font = `${P.metaWeight} ${sp}px ${metaFont()}`;
  tracked(c, metaText(P.serial), M, H - M, sp * P.metaTrack, 'left');
}

/** Metadata typography → tText: everything except the hero word. */
function drawPoster(W, H){
  textCanvas.width = W; textCanvas.height = H;
  const c = tctx;
  c.clearRect(0, 0, W, H);
  c.fillStyle = '#fff'; c.strokeStyle = '#fff';
  c.textBaseline = 'alphabetic';

  if (P.metaOn) drawMetaFlyer(c, W, H);

  gl.bindTexture(gl.TEXTURE_2D, textTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, textCanvas);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
}

/* ══════════════════════════════════════════════════════════════════════════
   5. BRUSH / AUTO-SWEEP
   ═══════════════════════════════════════════════════════════════════════ */
const DRAG_VECS = { ttb:[0,-1], btt:[0,1], ltr:[1,0], rtl:[-1,0] };

/** Auto-mode motion characters. Each one is a different answer to "where is
    the brush and how much is revealed"; see computeAnim for the bodies.
    DIRECTIONAL marks the presets that actually consult Auto Direction, so
    the control panel can hide that select for the ones that ignore it. */
const ANIM_PRESETS = {
  sweep: 'Sweep — wipe in, hold, wipe away',
  drift: 'Drift — travel continuously, never erase',
  orbit: 'Orbit — brush circles the frame',
  pulse: 'Pulse — breathe in and out in place',
  boil:  'Boil — churn in place, no travel',
};
const DIRECTIONAL = new Set(['sweep', 'drift']);

function ease(t, mode){
  t = Math.min(1, Math.max(0, t));
  if (mode === 'easein')  return t*t;
  if (mode === 'easeout') return 1-(1-t)*(1-t);
  if (mode === 'easeinout') return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
  return t;
}

/* Content wipe rhythm within one cycle, as fractions of the cycle:
   sweep in (0 -> 0.22), stay fully present (0.22 -> 0.52), then sweep away
   over the remaining 48% — the erase is deliberately the longest phase so
   the content lingers and then drifts off rather than snapping away. */
const APPEAR_END = 0.22, HOLD_END = 0.52;

/* Projection that turns a uv into "distance ahead of the sweep" for each
   direction, so the content wipe travels along the same axis the brush
   does. coord = bias + dot(uv, axis); the sweep reveals where coord is
   large, so coord == 1 is the edge the sweep starts from. */
const SWEEP_AXIS = {
  ttb: { axis:[ 0,  1], bias:0 },   // starts at the top
  btt: { axis:[ 0, -1], bias:1 },   // starts at the bottom
  ltr: { axis:[-1,  0], bias:1 },   // starts at the left
  rtl: { axis:[ 1,  0], bias:0 },   // starts at the right
};

const SWEEP_FULL = { reveal: 1, hide: 0 };
let sweep = SWEEP_FULL;
let sweepAxis = SWEEP_AXIS.ttb;
let forceContentVisible = false;   // export: pin the sweep to fully-revealed

let pointerUV = {x:0.5,y:0.62}, pointerActive = false, pointerPrev = null, pointerVel = {x:0,y:0};
function canvasToUV(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  return { x:(clientX-r.left)/r.width, y:1-(clientY-r.top)/r.height };
}
canvas.addEventListener('pointermove', e => {
  if (P.interactionMode !== 'manual') return;
  const uv = canvasToUV(e.clientX, e.clientY);
  if (pointerPrev) pointerVel = { x:(uv.x-pointerPrev.x)*35, y:(uv.y-pointerPrev.y)*35 };
  pointerPrev = uv; pointerUV = uv; pointerActive = true;
});
canvas.addEventListener('pointerleave', () => { pointerActive = false; pointerPrev = null; pointerVel = {x:0,y:0}; });

/** ONE animation cycle drives everything.
    Previously the brush ran off Auto Speed/Direction/Loop/Easing while the
    content wipe ran off its own separate speed and softness — two clocks
    for one motion, which is why it never felt cohesive. Now Auto Speed,
    Auto Direction, Auto Loop Mode and Auto Easing govern the brush AND the
    content reveal/erase together, and the wipe's edge feather comes from
    Brush Radius so the wipe is literally as soft as the brush painting it.

    In Manual mode there is no cycle: the content simply stays present and
    the pointer does the melting.

    Returns { brush, dragDir, sweep, axis }. */
function computeAnim(t){
  const dirKey = DRAG_VECS[P.autoDirection] ? P.autoDirection : 'ttb';
  const d  = DRAG_VECS[dirKey];
  const ax = SWEEP_AXIS[dirKey];

  if (P.interactionMode === 'manual'){
    const speed = Math.hypot(pointerVel.x, pointerVel.y);
    const k = Math.min(1, speed * 1.2);
    return {
      brush: pointerUV,
      dragDir: speed > 0.001 ? { x:(pointerVel.x/speed)*k, y:(pointerVel.y/speed)*k } : { x:0, y:0.12 },
      sweep: SWEEP_FULL,
      axis: ax
    };
  }

  /* Cycle length. A full appear/stay/erase pass should feel unhurried, so
     the default (Auto Speed 10) runs ~16s rather than the previous ~4s. */
  const period = Math.max(2.0, 160 / Math.max(P.autoSpeed, 0.5));
  const raw = (P.autoLoopMode === 'pingpong')
    ? 1 - Math.abs(((t / period) % 2) - 1)
    : (t / period) % 1;
  const u = ease(raw, P.autoEasing);

  const preset = ANIM_PRESETS[P.animPreset] ? P.animPreset : 'sweep';

  /* Every preset is a choice of two things only: where the brush is this
     frame, and how much of the content the sweep is currently showing.
     Everything else (turbulence, persistence, smear) is already in the
     fluid pass, so a preset never needs to touch the simulation itself. */
  if (preset === 'orbit'){
    const a = raw * Math.PI * 2;
    return {
      brush: { x: 0.5 + Math.cos(a) * 0.28, y: 0.5 + Math.sin(a) * 0.28 },
      dragDir: { x: -Math.sin(a), y: Math.cos(a) },   // tangent to the circle
      sweep: SWEEP_FULL, axis: ax
    };
  }

  if (preset === 'boil'){
    /* Brush parked, content permanently present: the turbulence and
       persistence do all the work, so the shape churns without going
       anywhere. Pairs with a high Fluid Warp. */
    return { brush:{x:0.5,y:0.55}, dragDir:{x:0,y:0.12}, sweep: SWEEP_FULL, axis: ax };
  }

  if (preset === 'drift'){
    /* Continuous travel with no erase phase — the trail keeps getting
       pushed the same way and never washes off, so it accumulates instead
       of cycling. Uses raw rather than eased progress so the wrap point
       does not visibly stutter. */
    let bx = 0.5, by = 0.62;
    if      (dirKey === 'ttb') by = 1 - raw;
    else if (dirKey === 'btt') by = raw;
    else if (dirKey === 'ltr') bx = raw;
    else if (dirKey === 'rtl') bx = 1 - raw;
    return { brush:{x:bx,y:by}, dragDir:{x:d[0],y:d[1]}, sweep: SWEEP_FULL, axis: ax };
  }

  if (preset === 'pulse'){
    /* Breathe in place: the reveal edge rises across the first half of the
       cycle and retreats across the second, with the brush parked. */
    const b = raw < 0.5 ? raw / 0.5 : 1 - (raw - 0.5) / 0.5;
    return {
      brush:{x:0.5,y:0.55}, dragDir:{x:0,y:0.12},
      sweep: { reveal: ease(b, P.autoEasing), hide: 0 }, axis: ax
    };
  }

  // ── sweep (default): the original directional wipe ──
  let bx = 0.5, by = 0.62;
  if      (dirKey === 'ttb') by = 1 - u;
  else if (dirKey === 'btt') by = u;
  else if (dirKey === 'ltr') bx = u;
  else if (dirKey === 'rtl') bx = 1 - u;

  /* Phase boundaries are taken from RAW progress so the appear / stay /
     erase proportions above hold exactly, with Auto Easing applied WITHIN
     each phase so it still shapes how the wipe edge moves. Easing the whole
     cycle instead (the previous behaviour) warped the durations — ease-in
     stretched the appear and compressed the erase, which is the opposite of
     a slow drift-away. */
  let sw;
  if (raw < APPEAR_END){
    sw = { reveal: ease(raw / APPEAR_END, P.autoEasing), hide: 0 };
  } else if (raw < HOLD_END){
    sw = { reveal: 1, hide: 0 };
  } else {
    sw = { reveal: 1, hide: ease((raw - HOLD_END) / (1 - HOLD_END), P.autoEasing) };
  }

  return { brush:{x:bx,y:by}, dragDir:{x:d[0],y:d[1]}, sweep: sw, axis: ax };
}

/** Wipe edge feather, derived from Brush Radius rather than its own slider. */
function sweepSoftness(){ return Math.min(0.5, Math.max(0.03, P.brushRadius * 0.9)); }

/* ══════════════════════════════════════════════════════════════════════════
   6. SIZING / RENDER LOOP
   ═══════════════════════════════════════════════════════════════════════ */
const POSTER_UNIT = 1400;
let bufW = 0, bufH = 0;
let phase = 0, last = performance.now(), running = true;
/* Melt keeps its own clock. Driving it off `phase` tied its speed to the
   content cycle and stopped it dead whenever the fluid was paused; the melt
   is a property of the material, not of the reveal animation, so it runs
   whenever the frame is live and only Freeze stops it. */
/* Timestep handed to the melt integrator. The live loop sets it from the
   wall clock; the export paths overwrite it with a fixed value so captured
   motion does not depend on how fast the machine renders. Melt no longer
   needs a phase accumulator of its own — the simulation IS its state. */
let simDt = 1 / 60;
const MELT_DT = 1 / 60;   // the melt integrator's fixed step
let meltAccum = 0;        // unspent real time waiting to be integrated

function aspectRatio(){
  const [a, b] = P.aspect.split(':').map(Number);
  return a / b;
}

function layout(){
  const stage = document.getElementById('stage');
  const pad = 2 * parseFloat(getComputedStyle(stage).paddingLeft);
  const availW = stage.clientWidth  - pad;
  const availH = stage.clientHeight - pad;
  const ar = aspectRatio();

  let cssW = availW, cssH = cssW / ar;
  if (cssH > availH){ cssH = availH; cssW = cssH * ar; }

  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';

  /* Capped at 1.5 rather than 2. On a retina display a cap of 2 quadruples
     the pixel count against a 1x screen, and the post pass is the most
     expensive thing here — that alone can be the difference between a
     machine holding 60fps and not. The artwork is soft and glowing, so the
     resolution it loses is far less visible than the frame rate it buys,
     and exports are unaffected: they render at their own size. */
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  setBufferSize(Math.round(cssW * dpr), Math.round(cssH * dpr));
}

function setBufferSize(w, h){
  w = Math.max(2, Math.min(w, MAX_TEX));
  h = Math.max(2, Math.min(h, MAX_TEX));
  if (w === bufW && h === bufH) return;
  bufW = canvas.width = w;
  bufH = canvas.height = h;
  resizeAllRT(w, h);
  resetFluid();
  drawPoster(w, h);
  drawHeroMask(w, h);
  updateHud();
}

function updateHud(){
  const pct = busy.startsWith('gif') ? ` · GIF ${busy.split(':')[1] || 0}%` : '';
  document.getElementById('hudTxt').textContent =
    `${P.aspect} · ${bufW}×${bufH} · SIM ${simW}×${simH} · ` +
    `${IS_GL2 ? 'GL2' : 'GL1'}/${HDR_OK ? 'F16' : 'U8'} · SEED ${P.seed.toFixed(1)}${pct}`;
}

/** One fluid-sim step. Callable both from the live render loop and from
    the export fast-forward loop (which uses a synthetic time value).

    `dt` is the real time this step represents. It defaults to 1/60 so the
    export fast-forwards — which advance a fixed amount of sim per step and
    were tuned against that — keep behaving exactly as they did; only the
    live loop passes a measured delta. */
function stepFluid(t, dt){
  const flow = computeAnim(t);
  sweep = forceContentVisible ? SWEEP_FULL : flow.sweep;
  sweepAxis = flow.axis;

  const src = rtFluid[fluidFront];
  const dst = rtFluid[1 - fluidFront];
  const simAR = simW / simH;
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
  gl.viewport(0, 0, simW, simH);
  gl.useProgram(progFluid);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex); i1(progFluid,'tPrev',0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, maskTex); i1(progFluid,'tMask',1);
  f1(progFluid,'uDither', HDR_OK ? 0 : 1);
  f1(progFluid,'uMeltSource', P.meltSource ? 1 : 0);
  f1(progFluid,'uDrip', P.waterDrip ? P.dripAmount : 0);
  f1(progFluid,'uAspect', simAR);
  f2(progFluid,'uBrush', flow.brush.x * simAR, flow.brush.y);
  f1(progFluid,'uBrushRadius', P.brushRadius);
  f1(progFluid,'uSmear', P.smearIntensity);
  f1(progFluid,'uPersistence', P.burnOn ? P.persistence : 0.0);
  f1(progFluid,'uWarp', P.fluidWarp);
  f1(progFluid,'uWarpScale', P.warpScale);
  f2(progFluid,'uDragDir', flow.dragDir.x, flow.dragDir.y);
  f1(progFluid,'uTime', t);
  f1(progFluid,'uSeed', P.seed);
  /* Clamped for the same reason the melt step clamps: a backgrounded tab
     hands back a huge delta, and an unbounded step would advect a whole
     frame's worth of material in one go. */
  f1(progFluid,'uStep', Math.min(dt === undefined ? 1/60 : dt, 1/20) * 60);
  f1(progFluid,'uSweepReveal', sweep.reveal);
  f1(progFluid,'uSweepHide', sweep.hide);
  f1(progFluid,'uSweepSoft', sweepSoftness());
  f2(progFluid,'uSweepAxis', sweepAxis.axis[0], sweepAxis.axis[1]);
  f1(progFluid,'uSweepBias', sweepAxis.bias);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  fluidFront = 1 - fluidFront;
}

function renderFrame(){
  const ar = bufW / bufH;

  /* ── PASS A: fluid sim (one step per rendered frame) ─────────────────── */
  if (P.burnOn && P.playing) stepFluid(phase, simDt);
  else if (!P.burnOn) stepFluid(phase, simDt);   // keeps buffer decaying to plain mask (persistence forced 0 above)

  /* ── PASS M: melt sim ──────────────────────────────────────────────────
     FIXED TIMESTEP. Feeding the integrator the wall-clock delta made the
     melt's appearance depend on the viewer's frame rate: the same ten
     seconds of simulated time produced mean displacement 0.207 at 60fps,
     0.185 at 30fps and 0.136 at 20fps — a third weaker, and coarser with
     it, on a slower machine. That is why the deployed page can look
     different from the same file running locally.

     Real time is accumulated and spent in fixed 1/60 steps instead, so the
     result is identical on any hardware. The substep cap stops a slow
     frame from triggering a catch-up spiral that would make things worse;
     past that point the melt simply runs in slow motion rather than
     changing character.

     Skipped entirely when melt is off, so the buffer stays cold and
     turning the amount up starts a fresh melt. */
  if (P.postOn && P.melt > 0.0005 && P.playing){
    meltAccum += Math.min(simDt, 0.1) * P.meltSpeed;
    let n = 0;
    while (meltAccum >= MELT_DT && n < 6){ stepMelt(MELT_DT); meltAccum -= MELT_DT; n++; }
    if (meltAccum > MELT_DT * 6) meltAccum = MELT_DT * 6;
  }

  /* ── PASS B: multi-scale glow pyramid ─────────────────────────────────
     Build 4 successively halved levels, blur each by the same radius in its
     own texels, then sum them. Because level i's texels are 2^(i+1) screen
     pixels wide, one fixed radius yields a tight rim AND a wide halo in the
     same pass — the thing a single-scale blur structurally cannot do, and
     cheaper than one very wide blur because most work happens at low res. */
  const fluidTex = rtFluid[fluidFront].tex;
  const levelRadius = Math.max(0.4, P.glowSoftness * 0.14);

  let downSrc = rtFluid[fluidFront];
  for (let i = 0; i < PYR; i++){
    const a = rtPyrA[i], b = rtPyrB[i];

    // downsample previous level -> a
    gl.useProgram(progDown);
    gl.bindFramebuffer(gl.FRAMEBUFFER, a.fbo);
    gl.viewport(0, 0, a.w, a.h);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, downSrc.tex); i1(progDown,'tSrc',0);
    f2(progDown,'uSrcTexel', 1 / downSrc.w, 1 / downSrc.h);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // separable blur at this level: a -> b (H), b -> a (V)
    gl.useProgram(progBlur);
    f1(progBlur,'uRadius', levelRadius);
    f2(progBlur,'uTexel', 1 / a.w, 1 / a.h);

    gl.bindFramebuffer(gl.FRAMEBUFFER, b.fbo);
    gl.viewport(0, 0, b.w, b.h);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, a.tex); i1(progBlur,'tSrc',0);
    f2(progBlur,'uDir', 1, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.bindFramebuffer(gl.FRAMEBUFFER, a.fbo);
    gl.viewport(0, 0, a.w, a.h);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, b.tex); i1(progBlur,'tSrc',0);
    f2(progBlur,'uDir', 0, 1);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    downSrc = a;
  }

  // combine levels -> rtGlow
  gl.useProgram(progCombine);
  gl.bindFramebuffer(gl.FRAMEBUFFER, rtGlow.fbo);
  gl.viewport(0, 0, rtGlow.w, rtGlow.h);
  for (let i = 0; i < PYR; i++){
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.bindTexture(gl.TEXTURE_2D, rtPyrA[i].tex);
    i1(progCombine, 't' + i, i);
  }
  gl.uniform4f(loc(progCombine,'uW'), 0.35, 0.28, 0.22, 0.15);
  f1(progCombine,'uGain', 1.7);   // compensates for energy spread across levels
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  const glowTex = rtGlow.tex;

  /* ── PASS C: thermal gradient map ─────────────────────────────────────── */
  gl.bindFramebuffer(gl.FRAMEBUFFER, rtScene.fbo);
  gl.viewport(0, 0, bufW, bufH);
  gl.useProgram(progThermal);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fluidTex); i1(progThermal,'tFluid',0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, glowTex);  i1(progThermal,'tGlow',1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, maskTex);  i1(progThermal,'tMask',2);
  f3(progThermal,'uGround', hex3(P.ground));
  f3(progThermal,'uContent', hex3(P.contentColor));
  f3(progThermal,'uBurn', hex3(P.burnColor));
  f3(progThermal,'uPrimary', hex3(P.glowPrimary));
  f3(progThermal,'uSecondary', hex3(P.glowSecondary));
  f1(progThermal,'uRgbSplit', P.rgbSplitGlow);
  f1(progThermal,'uExposure', P.exposure);
  f1(progThermal,'uFlat', P.burnOn ? 0 : 1);
  f1(progThermal,'uMeltSource', P.meltSource ? 1 : 0);
  f1(progThermal,'uSeparate', P.separateGlyphs ? 1 : 0);
  f1(progThermal,'uSweepReveal', sweep.reveal);
  f1(progThermal,'uSweepHide', sweep.hide);
  f1(progThermal,'uSweepSoft', sweepSoftness());
  f2(progThermal,'uSweepAxis', sweepAxis.axis[0], sweepAxis.axis[1]);
  f1(progThermal,'uSweepBias', sweepAxis.bias);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  /* ── PASS 2: scanner artifacts → screen ──────────────────────────────── */
  const fx = P.postOn ? 1 : 0;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, bufW, bufH);
  gl.useProgram(progPost);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, rtScene.tex);       i1(progPost,'tScene',0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, textTex);           i1(progPost,'tText',1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, rtMelt[meltFront].tex); i1(progPost,'tMelt',2);
  f1(progPost,'uAspect', ar);
  f1(progPost,'uUnit', POSTER_UNIT);
  f1(progPost,'uTime', phase);
  f1(progPost,'uSeed', P.seed);
  f1(progPost,'uGrain', P.grain * fx);
  f1(progPost,'uGrainSize', P.grainSize);
  f1(progPost,'uThresh', P.thresh * fx);
  f1(progPost,'uContrast', P.postOn ? P.contrast : 1.0);
  f1(progPost,'uMode', P.textMode);
  f3(progPost,'uInk', hex3(P.ink));
  f1(progPost,'uLens', P.lensBlur * fx);
  f1(progPost,'uLensFocus', P.lensFocus);
  f1(progPost,'uLensRange', P.lensRange);
  f1(progPost,'uLensHi', P.lensHighlight);
  f1(progPost,'uLensDistort', P.lensDistort * fx);
  f1(progPost,'uLensEdge', P.lensEdge);
  f1(progPost,'uLensFull', P.lensMode === 'full' ? 1 : 0);
  f1(progPost,'uLensLow', lensLowActive() ? 1 : 0);
  f1(progPost,'uLensFringe', P.lensFringe * fx);
  f1(progPost,'uMelt', P.melt * fx);
  f1(progPost,'uMeltType', P.meltType);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ── Adaptive blur quality ──────────────────────────────────────────────
   The 48-tap bokeh gather is the single most expensive thing in the frame:
   measured on a discrete GPU it is 2.68ms of a 4.98ms frame, and dropping
   to the 16-tap gather takes the frame to 1.70ms — a 36% saving, far more
   than any other control here can recover. That makes it the right and
   only knob to turn when a machine cannot hold its refresh rate.

   This watches the frame interval that actually gets delivered rather than
   guessing from the GPU string, which is the only way to be right about
   both an integrated laptop chip and a fast card driving a 4K window. On
   hardware with headroom it sorts 45 numbers a second and never switches
   anything. */
const FPS_WINDOW = 45;
let fpsSamples = [];
let fpsWarmup  = 60;         // shader compile and the first texture uploads are not frame rate
let autoLensLow = false;

function noteFrameInterval(rawMs){
  if (fpsWarmup > 0){ fpsWarmup--; return; }
  if (rawMs > 250) return;   // backgrounded tab or a blocking dialog, not a frame rate
  fpsSamples.push(rawMs);
  if (fpsSamples.length < FPS_WINDOW) return;
  const s = fpsSamples.slice().sort((a, b) => a - b);
  const median = s[s.length >> 1];
  fpsSamples.length = 0;
  /* Hysteresis, and deliberately asymmetric. Degrade below ~50fps, but
     only climb back with real headroom (~74fps) — a machine sitting just
     under its refresh rate would otherwise flip every window, and the
     bokeh visibly changes character when it does. */
  if (!autoLensLow && median > 20.0)      autoLensLow = true;
  else if (autoLensLow && median < 13.5)  autoLensLow = false;
}

/** Exports always gather at full quality: renderFrame only ever runs with
    `running` false when an export path drove it, and a still going to a
    4200px PNG should not inherit a decision made about live playback. */
function lensLowActive(){
  if (!running) return false;
  if (P.lensQuality === 'low')  return true;
  if (P.lensQuality === 'high') return false;
  return autoLensLow;                       // 'auto'
}

function loop(now){
  const raw = now - last;
  const dt  = Math.min(raw / 1000, 0.05);
  last = now;
  /* Pause is now the single stop control (the separate Freeze toggle is
     gone), so it halts the master clock as well as the fluid step —
     otherwise the post-process animation would keep running while paused. */
  if (running && P.playing) noteFrameInterval(raw);
  if (P.playing){ phase += dt; simDt = dt; }
  if (running) renderFrame();
  if (P.playing) syncTimeline();
  requestAnimationFrame(loop);
}

/* ── TIMELINE ───────────────────────────────────────────────────────────
   Both simulations are history-dependent: their state is the accumulation
   of every step taken to get here, so unlike the brush position there is
   no closed form for "the frame at t = 9.4s". Landing on an exact frame
   means rebuilding the sim up to it, which is the same wind-up the export
   already runs — so scrubbing and exporting agree by construction, and
   the frame you stop on is the frame you get.

   The wind-up is short while the handle is moving and full on release,
   which keeps dragging responsive without settling for a rough frame. */
let timelineInput = null, timelineVal = null, playSegButtons = [];

/** One full pass of the animation. Ping-pong runs out and back, so its
    cycle is twice the period before it repeats. */
function cycleSeconds(){
  const period = Math.max(2.0, 160 / Math.max(P.autoSpeed, 0.5));
  return P.autoLoopMode === 'pingpong' ? period * 2 : period;
}

/** Where the current phase sits in that cycle, 0..1. */
function timelineU(){
  const c = cycleSeconds();
  return c > 0 ? (((phase % c) + c) % c) / c : 0;
}

/** Warm-up long enough for the trail to have decayed to ~2%, derived from
    the decay rate rather than guessed, so a long persistence still lands
    on a settled frame and a short one does not pay for steps it cannot
    see. */
function settleSteps(){
  const p = Math.min(Math.max(P.persistence, 0.5), 0.995);
  return Math.min(500, Math.max(40, Math.ceil(Math.log(0.02) / Math.log(p))));
}

/** Rebuild both simulations so they are settled AT time t. */
function settleAt(t, steps){
  const dt = 1 / 24;
  resetFluid();
  resetMelt();
  meltAccum = 0;
  let u = t - steps * dt;
  for (let i = 0; i < steps; i++){
    u += dt;
    stepFluid(u);
    if (P.melt > 0.0005) stepMelt(dt * P.meltSpeed);
  }
  phase = t;
}

/** Scrubbing is a transport action: it stops playback, because a handle
    that fights the clock for control of the same value is unusable. */
function scrubTo(u, fast){
  P.playing = false;
  syncPlayButtons();
  settleAt(u * cycleSeconds(), fast ? Math.min(60, settleSteps()) : settleSteps());
  renderFrame();
}

/** Move the handle to follow playback. Skipped while the control has
    focus so it cannot fight the user's own drag or arrow keys. */
function syncTimeline(){
  if (!timelineInput || document.activeElement === timelineInput) return;
  timelineInput.value = timelineU();
  if (timelineVal) timelineVal.textContent = (timelineU() * cycleSeconds()).toFixed(2) + 's';
}

/** Reflect P.playing on the Pause/Play buttons without a full buildUI(),
    which would tear the timeline slider out from under an active drag. */
function syncPlayButtons(){
  for (const [val, btn] of playSegButtons) btn.classList.toggle('on', P[ 'playing' ] === val);
}

/* ══════════════════════════════════════════════════════════════════════════
   7. EXPORT — high-res PNG, with the fluid sim fast-forwarded to a
   "settled" state so the export matches what extended on-screen play
   would look like rather than a blank first frame.
   ═══════════════════════════════════════════════════════════════════════ */
function exportPNG(){
  const ar = aspectRatio();
  let H = P.exportH;
  let W = Math.round(H * ar);
  if (W > MAX_TEX || H > MAX_TEX){
    const k = MAX_TEX / Math.max(W, H);
    W = Math.floor(W * k); H = Math.floor(H * k);
  }

  const prevW = bufW, prevH = bufH;
  const prevCssW = canvas.style.width, prevCssH = canvas.style.height;
  const prevPhase = phase;

  running = false;
  forceContentVisible = true;   // a static export should never land mid-fade of the content cycle
  setBufferSize(W, H);   // resets fluid buffers at the new resolution

  /* setBufferSize() just cleared both simulations, so they have to be
     rebuilt before anything downstream can be composited — and that is
     true whether the transport is playing or paused. Gating this on
     P.playing is exactly what made a paused export write a pure black
     PNG: nothing refilled the fluid buffer, and every pass that reads it
     had nothing to read.

     The wind-up now ends ON the current phase instead of running past it,
     so a paused export lands on the frame being looked at rather than one
     warm-up further along. */
  if (P.burnOn){
    const target = 0.02;
    const p = Math.min(Math.max(P.persistence, 0.5), 0.995);
    const steps = Math.min(500, Math.max(40, Math.ceil(Math.log(target) / Math.log(p))));
    const dt = 1 / 24;
    let t = phase - steps * dt;
    for (let i = 0; i < steps; i++){ t += dt; stepFluid(t); if (P.melt > 0.0005) stepMelt(dt * P.meltSpeed); }
    phase = t;
  }

  renderFrame();

  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.download = `radiant-burnt_${P.serial.replace(/[^\w]+/g,'-')}_${W}x${H}_${stamp}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);

    phase = prevPhase;
    forceContentVisible = false;
    setBufferSize(prevW, prevH);
    canvas.style.width = prevCssW; canvas.style.height = prevCssH;
    running = true;
  }, 'image/png');
}

/* ══════════════════════════════════════════════════════════════════════════
   7b. GIF ENCODER — GIF89a, written out by hand
   The project ships as one file with no dependencies, so pulling in a GIF
   library is not on the table. This is the whole format: a median-cut
   palette shared by every frame, nearest-colour mapping through a 15-bit
   cache, GIF's variable-width LZW, and the byte layout around it.
   ═══════════════════════════════════════════════════════════════════════ */

/** Median cut. Repeatedly split the box with the longest colour axis at its
    median along that axis. Cheap, deterministic, and good enough for
    posters — where the palette is dominated by one ramp rather than by the
    scattered colours a photograph would need. */
function buildPalette(samples, maxColors){
  const count = samples.length / 3;
  const mkBox = ids => {
    let lo = [255,255,255], hi = [0,0,0], sum = [0,0,0];
    for (const i of ids){
      for (let c = 0; c < 3; c++){
        const v = samples[i*3+c];
        if (v < lo[c]) lo[c] = v;
        if (v > hi[c]) hi[c] = v;
        sum[c] += v;
      }
    }
    const ext = [hi[0]-lo[0], hi[1]-lo[1], hi[2]-lo[2]];
    /* Longest axis is weighted by luma response: a given spread in green is
       far more visible than the same spread in blue, so splitting on raw
       extent wastes palette entries on differences nobody sees. */
    const w = [ext[0]*0.299, ext[1]*0.587, ext[2]*0.114];
    const axis = w[0] >= w[1] && w[0] >= w[2] ? 0 : (w[1] >= w[2] ? 1 : 2);
    const n = Math.max(ids.length, 1);
    return { ids, axis, score: w[axis] * Math.cbrt(ids.length),
             mean: [Math.round(sum[0]/n), Math.round(sum[1]/n), Math.round(sum[2]/n)] };
  };

  const all = new Array(count);
  for (let i = 0; i < count; i++) all[i] = i;
  let boxes = [mkBox(all)];

  while (boxes.length < maxColors){
    let bi = -1, best = 0;
    for (let i = 0; i < boxes.length; i++){
      if (boxes[i].ids.length > 1 && boxes[i].score > best){ best = boxes[i].score; bi = i; }
    }
    if (bi < 0) break;
    const b = boxes[bi], ch = b.axis;
    b.ids.sort((p, q) => samples[p*3+ch] - samples[q*3+ch]);
    const mid = b.ids.length >> 1;
    boxes.splice(bi, 1, mkBox(b.ids.slice(0, mid)), mkBox(b.ids.slice(mid)));
  }
  return boxes.map(b => b.mean);
}

/** Nearest palette entry, memoised on the top 5 bits of each channel. The
    cache is what makes this viable: without it every pixel of every frame
    would run a linear scan over 256 entries. */
function paletteMapper(pal){
  const cache = new Int16Array(32768).fill(-1);
  return (r, g, b) => {
    const key = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
    const hit = cache[key];
    if (hit >= 0) return hit;
    let best = 0, bd = Infinity;
    for (let i = 0; i < pal.length; i++){
      const dr = r - pal[i][0], dg = g - pal[i][1], db = b - pal[i][2];
      const d = dr*dr*0.299 + dg*dg*0.587 + db*db*0.114;
      if (d < bd){ bd = d; best = i; }
    }
    cache[key] = best;
    return best;
  };
}

/** GIF's LZW: variable code width from minCodeSize+1 up to 12 bits, with a
    clear code emitted when the dictionary fills. */
function lzwEncode(px, minCodeSize){
  const CLEAR = 1 << minCodeSize, EOI = CLEAR + 1;
  let codeSize = minCodeSize + 1, next = EOI + 1;
  let dict = new Map();
  const bytes = [];
  let acc = 0, accBits = 0;
  const put = code => {
    acc |= code << accBits;
    accBits += codeSize;
    while (accBits >= 8){ bytes.push(acc & 0xff); acc >>>= 8; accBits -= 8; }
  };

  put(CLEAR);
  let prefix = px[0];
  for (let i = 1; i < px.length; i++){
    const k = px[i];
    const key = (prefix << 8) | k;
    const found = dict.get(key);
    if (found !== undefined){ prefix = found; continue; }
    put(prefix);
    if (next < 4096){
      dict.set(key, next);
      if (next === (1 << codeSize) && codeSize < 12) codeSize++;
      next++;
    } else {
      put(CLEAR);
      dict = new Map();
      next = EOI + 1;
      codeSize = minCodeSize + 1;
    }
    prefix = k;
  }
  put(prefix);
  put(EOI);
  if (accBits > 0) bytes.push(acc & 0xff);
  return bytes;
}

/** Assemble the container: header, logical screen descriptor with a global
    colour table, the NETSCAPE2.0 block that makes it loop forever, then one
    graphic-control + image-descriptor + LZW payload per frame. */
function buildGif(frames, w, h, pal, delayCs){
  const b = [];
  const str = s => { for (let i = 0; i < s.length; i++) b.push(s.charCodeAt(i)); };
  const short = v => b.push(v & 255, (v >> 8) & 255);

  const bits = Math.max(2, Math.ceil(Math.log2(Math.max(pal.length, 2))));
  const entries = 1 << bits;

  str('GIF89a');
  short(w); short(h);
  b.push(0x80 | 0x70 | (bits - 1), 0, 0);
  for (let i = 0; i < entries; i++){
    const c = pal[i] || [0, 0, 0];
    b.push(c[0], c[1], c[2]);
  }

  b.push(0x21, 0xFF, 11); str('NETSCAPE2.0'); b.push(3, 1, 0, 0, 0);

  for (const idx of frames){
    b.push(0x21, 0xF9, 4, 0x04, delayCs & 255, (delayCs >> 8) & 255, 0, 0);
    b.push(0x2C); short(0); short(0); short(w); short(h); b.push(0);
    b.push(bits);
    const data = lzwEncode(idx, bits);
    for (let i = 0; i < data.length; i += 255){
      const chunk = data.slice(i, i + 255);
      b.push(chunk.length);
      for (const v of chunk) b.push(v);
    }
    b.push(0);
  }
  b.push(0x3B);
  return new Uint8Array(b);
}

/* ══════════════════════════════════════════════════════════════════════════
   7c. MOTION EXPORT — animated GIF and WebM video
   ═══════════════════════════════════════════════════════════════════════ */

let busy = '';           // '' | 'gif' — drives the button label
let recorder = null;     // MediaRecorder while a video capture is running

/** Yield to the event loop between frames so the tab stays responsive and
    progress can paint.

    NOT setTimeout(0): browsers clamp timers to one second in a background
    tab, so ~70 yields turned a sub-second encode into a minute of nothing
    whenever the window lost focus — which is exactly when you'd expect to
    leave an export running. A MessageChannel task is not clamped, so the
    encode runs at full speed foreground or background. */
const nextTick = (() => {
  const mc = new MessageChannel();
  let queue = [];
  mc.port1.onmessage = () => { const q = queue; queue = []; for (const r of q) r(); };
  return () => new Promise(res => { queue.push(res); mc.port2.postMessage(0); });
})();

function downloadBlob(blob, ext){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  a.download = `radiant-burnt_${stamp}.${ext}`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 8000);
}

/** Drive the simulation forward by exactly one output frame. The live loop
    is driven by wall-clock deltas, which would make a capture's timing
    depend on how fast the machine happens to render; stepping by a fixed dt
    instead makes the exported motion identical on any hardware. */
function advance(dt){
  phase += dt;
  simDt = dt;
  /* renderFrame drives both simulations itself — stepping the fluid here as
     well ran the sim at double rate for the whole of a GIF capture, so the
     exported motion moved twice as fast as what was on screen. */
  renderFrame();
}

async function exportGIF(){
  if (busy) return;
  busy = 'gif'; buildUI();

  const prevW = bufW, prevH = bufH;
  const prevCssW = canvas.style.width, prevCssH = canvas.style.height;
  const prevPhase = phase;
  const ar = aspectRatio();

  const W = Math.max(2, Math.round(P.gifWidth));
  const H = Math.max(2, Math.round(W / ar));
  const fps = P.gifFps;
  const total = Math.max(2, Math.round(P.gifSeconds * fps));
  const dt = 1 / fps;

  running = false;
  forceContentVisible = false;
  setBufferSize(W, H);

  const scratch = document.createElement('canvas');
  scratch.width = W; scratch.height = H;
  const sx = scratch.getContext('2d', { willReadFrequently: true });

  try {
    /* Warm the sim so frame 1 is the settled look rather than a blank
       buffer — same reasoning as the PNG export. */
    const p = Math.min(Math.max(P.persistence, 0.5), 0.995);
    const warm = Math.min(400, Math.max(40, Math.ceil(Math.log(0.02) / Math.log(p))));
    for (let i = 0; i < warm; i++){
      phase += dt; stepFluid(phase);
      if (P.melt > 0.0005) stepMelt(dt * P.meltSpeed);
    }

    const rgba = [];
    for (let f = 0; f < total; f++){
      advance(dt);
      sx.drawImage(canvas, 0, 0);
      rgba.push(sx.getImageData(0, 0, W, H).data);
      busy = `gif:${Math.round(100 * (f + 1) / total * 0.6)}`;
      updateHud();
      await nextTick();   // keep the tab responsive
    }

    /* Sample across every frame so the shared palette covers the whole
       animation, not just its first moment. */
    const stride = Math.max(1, Math.floor((W * H * total) / 24000)) * 4;
    const samples = [];
    for (const d of rgba){
      for (let i = 0; i < d.length; i += stride){ samples.push(d[i], d[i+1], d[i+2]); }
    }
    const pal = buildPalette(new Uint8Array(samples), 256);
    const map = paletteMapper(pal);

    const frames = [];
    for (let f = 0; f < rgba.length; f++){
      const d = rgba[f], idx = new Uint8Array(W * H);
      for (let i = 0, j = 0; i < idx.length; i++, j += 4) idx[i] = map(d[j], d[j+1], d[j+2]);
      frames.push(idx);
      busy = `gif:${Math.round(60 + 40 * (f + 1) / rgba.length)}`;
      updateHud();
      await nextTick();
    }

    downloadBlob(new Blob([buildGif(frames, W, H, pal, Math.round(100 / fps))],
                          { type: 'image/gif' }), 'gif');
  } finally {
    phase = prevPhase;
    setBufferSize(prevW, prevH);
    canvas.style.width = prevCssW; canvas.style.height = prevCssH;
    running = true;
    busy = ''; buildUI();
  }
}

const VIDEO_TYPES = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];

/** Video goes through MediaRecorder on a canvas stream, so it records the
    live canvas in real time rather than stepping frames like the GIF path.
    That keeps it honest — what you watched is what lands in the file. */
function toggleRecord(){
  if (recorder && recorder.state === 'recording'){ recorder.stop(); return; }
  if (typeof MediaRecorder === 'undefined'){
    assetError = 'this browser has no MediaRecorder'; buildUI(); return;
  }
  const mime = VIDEO_TYPES.find(t => MediaRecorder.isTypeSupported(t));
  if (!mime){ assetError = 'no supported video codec'; buildUI(); return; }

  const stream = canvas.captureStream(60);
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16e6 });
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    downloadBlob(new Blob(chunks, { type: mime }), mime.startsWith('video/mp4') ? 'mp4' : 'webm');
    recorder = null;
    buildUI();
  };
  recorder.start();
  buildUI();
}

const ui = document.getElementById('ui');

function fmt(v, spec){
  if (spec.int) return String(Math.round(v));
  return Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(3).replace(/0+$/,'').replace(/\.$/,'.0');
}

/* Any parameter that changes the RASTERISED hero mask must be listed here,
   otherwise its control updates P but never re-runs drawHeroMask() and the
   canvas appears frozen until some unrelated redraw happens to fire.
   Purely shader-side parameters (e.g. contentColor) do NOT belong here —
   they are read fresh every frame. */
const HERO_KEYS = new Set([
  'title','fontSize','tracking','leading','wordSpacing',
  'aspect','contentType','assetScale','edgeBlur',
]);
const TYPO_KEYS = new Set([
  'subtitle','kicker','date','serial','aspect','metaLabel','metaOn',
  'metaScale','metaTrack','metaLead','metaLabelGap','metaWeight','metaCase',
  'metaMono',
]);
function touched(key){
  if (key === 'aspect') layout();
  if (HERO_KEYS.has(key)) drawHeroMask(bufW, bufH);
  if (TYPO_KEYS.has(key)) drawPoster(bufW, bufH);
  if (key === 'interactionMode') canvas.classList.toggle('manual', P.interactionMode === 'manual');
}

/** Many SVGs ship with only a viewBox and no width/height. Loaded into an
    <img> those report an unreliable intrinsic size (0 in some engines, a
    300x150 default in others), so the asset lands at the wrong scale or not
    at all. Inject concrete dimensions derived from the viewBox before use. */
function normalizeSvg(text){
  try {
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    const svg = doc.documentElement;
    if (!svg || svg.nodeName.toLowerCase() !== 'svg') return text;
    if (doc.getElementsByTagName('parsererror').length) return text;

    const vb  = (svg.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
    const bad = v => !v || /%\s*$/.test(v) || !parseFloat(v);
    let w = svg.getAttribute('width'), h = svg.getAttribute('height');

    if (bad(w) || bad(h)){
      if (vb.length === 4 && vb[2] > 0 && vb[3] > 0){ w = String(vb[2]); h = String(vb[3]); }
      else { w = '1000'; h = '1000'; }
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);
    }
    if (!svg.getAttribute('viewBox') && parseFloat(w) && parseFloat(h)){
      svg.setAttribute('viewBox', `0 0 ${parseFloat(w)} ${parseFloat(h)}`);
    }
    return new XMLSerializer().serializeToString(svg);
  } catch(e){ return text; }
}

let assetError = '';
function loadAssetFile(file, kind){
  const isSvg = /svg/i.test(file.type) || /\.svg$/i.test(file.name);
  const reader = new FileReader();
  reader.onload = () => {
    const src = isSvg
      ? 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(normalizeSvg(reader.result))
      : reader.result;
    const img = new Image();
    img.onload = () => {
      uploadedAsset = img; assetError = '';
      drawHeroMask(bufW, bufH);
      buildUI();
    };
    // Fail loudly in the panel rather than silently showing an empty poster.
    img.onerror = () => { assetError = 'could not decode this file'; buildUI(); };
    img.src = src;
  };
  reader.onerror = () => { assetError = 'could not read this file'; buildUI(); };
  if (isSvg) reader.readAsText(file); else reader.readAsDataURL(file);
}

function buildUI(){
  ui.innerHTML = '';
  /* Every node below is about to be replaced, so anything holding one is
     now pointing at a detached element. */
  timelineInput = null; timelineVal = null; playSegButtons = [];
  for (const sec of CONTROLS){
    const s = document.createElement('section');
    const h = document.createElement('h2');
    h.textContent = sec.title;
    h.onclick = () => s.classList.toggle('closed');
    const body = document.createElement('div');
    body.className = 'body';
    s.append(h, body);

    if (sec.items[0] && sec.items[0].t === 'toggle' && sec.items[0].big && !P[sec.items[0].k]) body.classList.add('dim');

    for (const it of sec.items){
      if (it.show && !it.show(P)) continue;

      if (it.t === 'palettes'){
        // (kept for potential future presets; unused in current layout)
      }

      else if (it.t === 'colors'){
        for (const [k, label] of it.keys){
          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = `<label>${label}</label>`;
          const inp = document.createElement('input');
          inp.type = 'color'; inp.autocomplete = 'off'; inp.value = P[k];
          inp.oninput = () => { P[k] = inp.value; touched(k); };
          row.appendChild(inp);
          body.appendChild(row);
        }
      }

      else if (it.t === 'range'){
        const slot = document.createElement('div');
        slot.className = 'slot';
        const row = document.createElement('div');
        row.className = 'row';
        const val = document.createElement('div');
        val.className = 'val';
        val.textContent = fmt(P[it.k], it);
        row.innerHTML = `<label>${it.l}</label>`;
        row.appendChild(val);
        const inp = document.createElement('input');
        inp.type = 'range'; inp.autocomplete = 'off';
        inp.min = it.min; inp.max = it.max; inp.step = it.step; inp.value = P[it.k];
        inp.oninput = () => {
          P[it.k] = parseFloat(inp.value);
          val.textContent = fmt(P[it.k], it);
          touched(it.k);
        };
        slot.append(row, inp);
        body.appendChild(slot);
      }

      else if (it.t === 'timeline'){
        const slot = document.createElement('div');
        slot.className = 'slot';
        const row = document.createElement('div');
        row.className = 'row';
        const val = document.createElement('div');
        val.className = 'val';
        row.innerHTML = `<label>${it.l}</label>`;
        row.appendChild(val);
        const inp = document.createElement('input');
        inp.type = 'range'; inp.autocomplete = 'off';
        inp.min = 0; inp.max = 1; inp.step = 0.001;
        inp.value = timelineU();
        const show = () => { val.textContent = (parseFloat(inp.value) * cycleSeconds()).toFixed(2) + 's'; };
        show();
        /* Short wind-up while dragging, full one on release. The step is
           1/1000 of the cycle — finer than a frame at any usable speed —
           so the arrow keys walk it frame by frame once focused. */
        inp.oninput  = () => { show(); scrubTo(parseFloat(inp.value), true); };
        inp.onchange = () => { show(); scrubTo(parseFloat(inp.value), false); };
        slot.append(row, inp);
        body.appendChild(slot);
        timelineInput = inp; timelineVal = val;
      }

      else if (it.t === 'text'){
        const f = document.createElement('div');
        f.className = 'fld';
        f.innerHTML = `<span>${it.l}</span>`;
        const inp = document.createElement('input');
        inp.type = 'text'; inp.autocomplete = 'off';
        inp.value = P[it.k].replace(/\n/g, '\\n');
        inp.oninput = () => { P[it.k] = inp.value.replace(/\\n/g, '\n'); touched(it.k); };
        f.appendChild(inp);
        body.appendChild(f);
      }

      else if (it.t === 'textarea'){
        const f = document.createElement('div');
        f.className = 'fld';
        f.innerHTML = `<span>${it.l}</span>`;
        const inp = document.createElement('textarea');
        inp.autocomplete = 'off';
        inp.value = P[it.k];
        inp.oninput = () => { P[it.k] = inp.value; touched(it.k); };
        f.appendChild(inp);
        body.appendChild(f);
      }

      else if (it.t === 'select'){
        const f = document.createElement('div');
        f.className = 'fld';
        f.innerHTML = `<span>${it.l}</span>`;
        const sel = document.createElement('select');
        sel.autocomplete = 'off';
        sel.innerHTML = it.opts.map(([v, t]) => `<option value="${v}">${t}</option>`).join('');
        sel.value = String(P[it.k]);
        sel.onchange = () => { P[it.k] = it.num ? parseFloat(sel.value) : sel.value; touched(it.k); buildUI(); };
        f.appendChild(sel);
        body.appendChild(f);
      }

      else if (it.t === 'segmented'){
        if (it.l){
          const lab = document.createElement('div');
          lab.className = 'fld'; lab.style.marginBottom = '4px';
          lab.innerHTML = `<span>${it.l}</span>`;
          body.appendChild(lab);
        }
        const g = document.createElement('div');
        g.className = 'seg';
        for (const [val, label] of it.opts){
          const b = document.createElement('button');
          b.type = 'button'; b.textContent = label;
          /* Straight value match. The old `invert` special-case inverted the
             HIGHLIGHT but not the click, so Pause set playing=true and Play
             set playing=false — the buttons did the opposite of their label. */
          if (P[it.k] === val) b.classList.add('on');
          b.onclick = () => { P[it.k] = val; touched(it.k); buildUI(); };
          if (it.k === 'playing') playSegButtons.push([val, b]);
          g.appendChild(b);
        }
        /* Optional trailing action button that shares the segmented grid, so
           it fills the empty cell beside an odd number of options. */
        if (it.action){
          const [label, act] = it.action;
          const b = document.createElement('button');
          b.type = 'button'; b.textContent = label;
          b.classList.add('act');
          b.onclick = () => ACTIONS[act]();
          g.appendChild(b);
        }
        body.appendChild(g);
      }

      else if (it.t === 'file'){
        const f = document.createElement('div');
        f.className = 'fld';
        f.innerHTML = `<span>${it.l}</span>`;
        const btn = document.createElement('div');
        btn.className = 'filebtn';
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = 'Upload';
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = it.accept;
        inp.onchange = () => { if (inp.files[0]) loadAssetFile(inp.files[0], it.k); };
        const nm = document.createElement('span');
        nm.className = 'name';
        nm.textContent = assetError ? ('⚠ ' + assetError)
                       : uploadedAsset ? 'asset loaded' : 'no file selected';
        if (assetError) nm.style.color = 'var(--hot)';
        btn.append(b, inp);
        f.append(btn, nm);
        body.appendChild(f);
      }

      else if (it.t === 'font'){
        const f = document.createElement('div');
        f.className = 'fld';
        f.innerHTML = `<span>${it.l}</span>`;
        const btn = document.createElement('div');
        btn.className = 'filebtn';
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = 'Upload Font';
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = it.accept;
        inp.onchange = () => { if (inp.files[0]) loadFontFile(inp.files[0], it.k); };
        const nm = document.createElement('span');
        nm.className = 'name';
        nm.textContent = P[it.k] ? P[it.k] : 'default typeface';
        btn.append(b, inp);
        f.append(btn, nm);
        body.appendChild(f);
      }

      else if (it.t === 'toggle'){
        const lab = document.createElement('label');
        lab.className = 'toggle' + (it.big ? ' big' : '');
        const inp = document.createElement('input');
        inp.type = 'checkbox'; inp.autocomplete = 'off'; inp.checked = !!P[it.k];
        inp.onchange = () => { P[it.k] = inp.checked; touched(it.k); buildUI(); };
        const sp = document.createElement('span');
        sp.textContent = it.l;
        lab.append(inp, sp);
        body.appendChild(lab);
      }

      else if (it.t === 'buttons'){
        const g = document.createElement('div');
        g.className = 'btns' + (it.one ? ' one' : '');
        for (const [label, action] of it.defs){
          const b = document.createElement('button');
          /* Labels may be functions so a button can report live state
             (recording / encoding progress) without its own renderer. */
          b.type = 'button';
          b.textContent = typeof label === 'function' ? label() : label;
          if (action === 'export') b.className = 'hot';
          if (action === 'record' && recorder && recorder.state === 'recording') b.className = 'hot';
          if (busy && action !== 'record') b.disabled = true;
          b.onclick = () => ACTIONS[action]();
          g.appendChild(b);
        }
        body.appendChild(g);
      }
    }
    ui.appendChild(s);
  }
}

/* ── Actions ────────────────────────────────────────────────────────────── */
const rnd  = (a, b) => a + Math.random() * (b - a);

const ACTIONS = {
  seed(){
    P.seed = Math.random() * 500;
    resetFluid();
    updateHud();
  },
  all(){
    ACTIONS.seed();
    P.brushRadius     = rnd(0.06, 0.35);
    P.smearIntensity  = rnd(0.05, 0.35);
    P.persistence     = rnd(0.80, 0.97);
    P.fluidWarp       = rnd(0.0, 0.18);
    P.warpScale       = rnd(1, 6);
    P.animPreset      = Object.keys(ANIM_PRESETS)[Math.floor(rnd(0, Object.keys(ANIM_PRESETS).length))];
    P.autoDirection   = ['ttb','btt','ltr','rtl'][Math.floor(rnd(0,4))];
    P.autoEasing      = ['linear','easein','easeout','easeinout'][Math.floor(rnd(0,4))];
    P.glowPrimary     = '#'+Math.floor(rnd(0,0xffffff)).toString(16).padStart(6,'0');
    P.glowSecondary   = '#'+Math.floor(rnd(0,0xffffff)).toString(16).padStart(6,'0');
    P.exposure        = rnd(0.6, 1.8);
    P.rgbSplitGlow    = rnd(0.0, 0.015);
    P.grain       = rnd(0.08, 0.28);
    P.thresh      = rnd(0.00, 0.42);
    P.lensBlur    = rnd(0.00, 0.045);
    P.lensDistort = rnd(-0.20, 0.35);
    P.lensFringe  = rnd(0.20, 1.30);
    P.lensFocus   = rnd(0.30, 0.75);
    P.melt        = rnd(0.00, 0.055);
    P.meltHeat    = rnd(0.30, 1.10);
    P.meltVisc    = rnd(0.60, 2.60);
    buildUI();
  },
  reset(){
    Object.assign(P, JSON.parse(JSON.stringify(DEFAULTS)));
    uploadedAsset = null;
    buildUI();
    layout();
    drawPoster(bufW, bufH);
    drawHeroMask(bufW, bufH);
    canvas.classList.toggle('manual', P.interactionMode === 'manual');
  },
  export: exportPNG,
  gif:    exportGIF,
  record: toggleRecord
};
document.getElementById('resetBtn').onclick = ACTIONS.reset;

/* ══════════════════════════════════════════════════════════════════════════
   9. BOOT
   ═══════════════════════════════════════════════════════════════════════ */
buildUI();
layout();

/* Some browsers restore <input>/<select> values (ranges, checkboxes,
   colors, dropdowns) on reload via a positional heuristic — even for
   elements created dynamically after load, and even inside a form with
   autocomplete="off". Critically, that restoration fires real input/change
   events, which run the normal control handlers and write the restored
   (stale) value straight into P — so merely re-rendering the DOM from P a
   moment later just faithfully redisplays the corruption. The reliable
   fix is to force P itself back to defaults (keeping the freshly-rolled
   seed) shortly after load, then rebuild from that. */
function resyncFromDefaults(){
  const seed = P.seed;
  Object.assign(P, JSON.parse(JSON.stringify(DEFAULTS)));
  P.seed = seed;
  buildUI();
  drawPoster(bufW, bufH);
  drawHeroMask(bufW, bufH);
  canvas.classList.toggle('manual', P.interactionMode === 'manual');
}
requestAnimationFrame(() => requestAnimationFrame(resyncFromDefaults));
setTimeout(resyncFromDefaults, 350);
setTimeout(resyncFromDefaults, 900);
setTimeout(resyncFromDefaults, 1800);

let rzTimer;
window.addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(layout, 90);
});

if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
  drawPoster(bufW, bufH);
  drawHeroMask(bufW, bufH);
});

document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.code === 'Space'){ e.preventDefault(); P.playing = !P.playing; buildUI(); }
  if (e.key === 'r' || e.key === 'R') ACTIONS.seed();
  if (e.key === 'e' || e.key === 'E') exportPNG();
});

requestAnimationFrame(loop);
</script>
